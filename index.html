<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>廣告作戰台｜序曲音樂學院</title>
<style>
/* 黑機身 × 科技感：青色＝資料、橘色＝警示（變數名沿用舊版，值換成新配色） */
:root{
  --ink:#121315; --sea:#181b1d; --surge:#202427; --line:#2c3438; --line-soft:#23292c;
  --foam:#E6EEF0; --mist:#8d9a9d; --dim:#5f6d71;
  --coral:#FF5A1F; --coral-deep:#7a3216; --coral-soft:#2a1710;
  --gold:#FCB52A; --gold-soft:#2a2210;
  --kelp:#3EC6E0; --kelp-soft:#0f2a30;
  --cyan:#3EC6E0; --ease:cubic-bezier(.16,1,.3,1);
  --disp:"Bahnschrift","Microsoft JhengHei",sans-serif;
  --sans:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Hiragino Sans",sans-serif;
  --mono:Consolas,"SF Mono",Menlo,ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--foam);
  font-family:var(--sans); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}

.wrap{max-width:1000px;margin:0 auto;padding:0 20px 100px}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--line-soft); margin-bottom:26px}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 0 18px;flex-wrap:wrap}
.brand h1{
  margin:0; font-size:26px; font-weight:800; letter-spacing:-.03em;
}
.brand .sub{color:var(--mist);font-size:12.5px;letter-spacing:.14em;margin-top:3px}
.wave-pick{display:flex;align-items:center;gap:8px}
.wave-pick label{white-space:nowrap;margin:0}
.wave-pick select{
  background:var(--sea); color:var(--foam); border:1px solid var(--line);
  border-radius:7px; padding:8px 11px; font-family:var(--sans); font-size:13.5px; max-width:260px;
}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--mist); font-family:var(--sans); font-size:14.5px; font-weight:600;
  padding:9px 15px; cursor:pointer; letter-spacing:.02em;
}
nav.tabs button:hover{color:var(--foam)}
nav.tabs button[aria-selected="true"]{color:var(--coral);border-bottom-color:var(--coral)}
nav.tabs button:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}

/* ---------- generic ---------- */
.panel{background:var(--sea);border:1px solid var(--line-soft);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.panel > h2{margin:0 0 4px;font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.panel > .lede{color:var(--mist);font-size:13.5px;margin:0 0 16px}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:700;margin-bottom:9px}
.hr{height:1px;background:var(--line-soft);margin:18px 0}
.muted{color:var(--mist)}
.tiny{font-size:12.5px}

button.act{
  background:var(--coral);color:#25100C;border:none;border-radius:7px;
  padding:9px 16px;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;
}
button.act:hover{filter:brightness(1.08)}
button.ghost{
  background:transparent;color:var(--mist);border:1px solid var(--line);border-radius:7px;
  padding:8px 14px;font-family:var(--sans);font-size:13.5px;cursor:pointer;
}
button.ghost:hover{color:var(--foam);border-color:var(--dim)}
button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

input,select,textarea{
  background:var(--ink);color:var(--foam);border:1px solid var(--line);
  border-radius:6px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%;
}
input.num-in{font-family:var(--mono);text-align:right}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--coral)}
label.fld{display:block;font-size:12px;color:var(--mist);margin-bottom:4px;letter-spacing:.04em}

/* ---------- verdict ---------- */
.verdict{border-radius:14px;padding:22px 24px;margin-bottom:16px;border:1px solid}
.verdict .vtitle{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:6px 0 6px}
.verdict .vline{font-size:14.5px;margin:0 0 14px}
.verdict.green{background:var(--kelp-soft);border-color:#1E6E5C}
.verdict.green .vtitle{color:var(--kelp)}
.verdict.amber{background:var(--gold-soft);border-color:#6B5520}
.verdict.amber .vtitle{color:var(--gold)}
.verdict.red,.verdict.full{background:var(--coral-soft);border-color:var(--coral-deep)}
.verdict.red .vtitle,.verdict.full .vtitle{color:var(--coral)}
.verdict.learning,.verdict.thin,.verdict.idle{background:var(--surge);border-color:var(--line)}
.verdict.learning .vtitle,.verdict.thin .vtitle,.verdict.idle .vtitle{color:var(--foam)}
.vlabel{font-size:11px;letter-spacing:.22em;font-weight:700;opacity:.8}

.todo{list-style:none;margin:0;padding:0}
.todo li{position:relative;padding-left:20px;margin-bottom:6px;font-size:14px}
.todo li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.agent{border-radius:14px;padding:18px 22px;margin-bottom:16px;border:1px solid var(--line);background:var(--surge)}
.agent.green{border-color:#1E6E5C}.agent.amber{border-color:#6B5520}.agent.red{border-color:var(--coral-deep)}
.agent .ahead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.agent .light{font-size:12px;font-weight:700;border-radius:999px;padding:3px 12px;border:1px solid}
.agent .light.green{color:var(--kelp);border-color:var(--kelp)}.agent .light.amber{color:var(--gold);border-color:var(--gold)}
.agent .light.red{color:var(--coral);border-color:var(--coral)}.agent .light.grey{color:var(--mist);border-color:var(--line)}
.agent .atitle{font-size:18px;font-weight:800;margin:8px 0 6px}
.agent .asum{font-size:14px;margin:0 0 12px;line-height:1.7}
.agent .amet{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:0 0 14px}
.agent .amet div{background:rgba(0,0,0,.22);border-radius:8px;padding:8px 10px}
.agent .amet b{display:block;font-size:17px}
.agent .sug{display:flex;justify-content:space-between;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.agent .sug > div:first-child{flex:1 1 220px}
.agent .sug button{white-space:nowrap}
.agent .sug .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-right:6px;color:var(--mist)}
.agent .sug.done{opacity:.55}
.agent details{margin-top:10px;font-size:13px}.agent summary{cursor:pointer;color:var(--mist)}
.why{background:rgba(0,0,0,.22);border-radius:8px;padding:11px 14px;margin:0 0 14px;font-size:13.5px}
.why p{margin:0 0 5px}.why p:last-child{margin:0}
.also{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.also .at{font-weight:700;font-size:14px;margin-bottom:3px}

/* ---------- seat grid (signature) ---------- */
.seats{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:14px 0 10px}
.seat{aspect-ratio:1/1.15;border-radius:4px 4px 7px 7px;border:1.5px solid var(--line);background:transparent;position:relative}
.seat.booked{border-color:var(--coral)}
.seat.showed{background:var(--coral);border-color:var(--coral)}
.seat.over{border-style:dashed;border-color:var(--gold)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mist)}
.legend i{display:inline-block;width:11px;height:12px;border-radius:3px 3px 5px 5px;border:1.5px solid var(--line);vertical-align:-2px;margin-right:5px}
.legend i.b{border-color:var(--coral)} .legend i.s{background:var(--coral);border-color:var(--coral)}

/* ---------- day strip ---------- */
.strip{display:flex;gap:3px;margin:10px 0 8px;flex-wrap:wrap}
.dcell{flex:1 0 22px;min-width:22px;text-align:center;border-radius:5px;padding:5px 0 4px;
  background:var(--surge);border:1px solid transparent;font-size:10.5px;color:var(--dim)}
.dcell .dn{font-family:var(--mono);font-size:11px;display:block;line-height:1.25}
.dcell.learn{background:var(--line-soft)}
.dcell.has{color:var(--foam);border-color:var(--line)}
.dcell.today{border-color:var(--coral);color:var(--coral);background:var(--coral-soft)}
.dcell.future{opacity:.45}

/* ---------- metric cards ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.mcard{background:var(--surge);border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px}
.mcard .mk{font-size:12px;color:var(--mist);letter-spacing:.05em}
.mcard .mv{font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin:2px 0}
.mcard .mv.g{color:var(--kelp)} .mcard .mv.a{color:var(--gold)} .mcard .mv.r{color:var(--coral)}
.mcard .mv.n{color:#557F87}
.mcard .mf{font-size:11.5px;color:var(--dim);font-family:var(--mono);line-height:1.55;overflow-wrap:anywhere}
.mcard .mt{font-size:11.5px;color:var(--mist);margin-top:5px}
.mcard .lock{font-size:11.5px;color:var(--gold);margin-top:5px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.13em;color:var(--dim);font-weight:700;
   padding:0 8px 8px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.tscroll{overflow-x:auto}
.rowbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 6px;font-family:var(--sans)}
.rowbtn:hover{color:var(--coral)}

/* ---------- entry row ---------- */
.entry{display:grid;gap:10px;align-items:end}
.entry.day{grid-template-columns:1.3fr .9fr .9fr .8fr .8fr .8fr auto}
.entry.book{grid-template-columns:1.2fr 1.2fr 1.4fr .7fr auto}
@media(max-width:860px){.entry.day,.entry.book{grid-template-columns:1fr 1fr}}

/* ---------- copy blocks ---------- */
.cblock{background:var(--surge);border:1px solid var(--line-soft);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.chead .cl{font-weight:800;font-size:15px}
.chead .ct{font-size:11px;letter-spacing:.14em;color:var(--coral);font-weight:700}
.cnote{font-size:12.5px;color:var(--mist);margin:0 0 10px}
.ctext{background:var(--ink);border:1px solid var(--line-soft);border-radius:7px;padding:13px 15px;
  white-space:pre-wrap;font-size:13.5px;line-height:1.8;margin-bottom:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 12px;
  font-size:12.5px;color:var(--foam);background:var(--sea);margin:0 6px 6px 0}
.pill.off{color:var(--dim);text-decoration:line-through;border-style:dashed}
.pill.on{border-color:var(--kelp);color:var(--kelp)}

details{background:var(--sea);border:1px solid var(--line-soft);border-radius:8px;padding:0;margin-top:8px}
details summary{cursor:pointer;padding:9px 14px;font-size:13px;color:var(--mist);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"為什麼 ▸ ";color:var(--dim);font-size:12px}
details[open] summary::before{content:"為什麼 ▾ "}
details .dbody{padding:0 14px 13px;font-size:13.5px;color:var(--foam);line-height:1.75}

/* ---------- checklist ---------- */
.chk{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:14px}
.chk input{width:17px;height:17px;flex:0 0 17px;margin-top:4px;accent-color:var(--coral)}
.chk.done span{color:var(--dim);text-decoration:line-through}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:var(--coral);color:#25100C;font-weight:700;font-size:14px;
  padding:11px 22px;border-radius:9px;opacity:0;transition:.22s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none}
.warnbar{background:var(--gold-soft);border:1px solid #6B5520;color:var(--gold);
  border-radius:9px;padding:11px 15px;font-size:13px;margin-bottom:16px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:620px){
  .seats{grid-template-columns:repeat(8,1fr)}
  .brand h1{font-size:21px}
  .wrap{padding:0 14px 80px}
}

/* ---------- login gate ---------- */
.gate{display:flex;align-items:center;justify-content:center;min-height:78vh;padding:20px 0}
.gcard{background:var(--sea);border:1px solid var(--line-soft);border-radius:16px;
  padding:32px 30px;width:100%;max-width:390px}
.glogo{font-size:24px;font-weight:800;letter-spacing:-.03em}
.gsub{color:var(--mist);font-size:11.5px;letter-spacing:.16em;margin-top:3px;margin-bottom:20px}
.gnote{font-size:13.5px;color:var(--mist);margin:0 0 18px;line-height:1.7}
.gbtn{width:100%;margin-top:18px;padding:12px}
.gwarn{font-size:12px;color:var(--gold);margin:14px 0 0;line-height:1.6}
.gerr{font-size:13px;color:var(--coral);margin:12px 0 0;font-weight:600}

/* ---------- sync badge ---------- */
.sync{font-size:11.5px;letter-spacing:.06em;padding:3px 10px;border-radius:999px;
  border:1px solid var(--line);color:var(--mist);white-space:nowrap}
.sync.ok{color:var(--kelp);border-color:#1E6E5C}
.sync.busy{color:var(--gold);border-color:#6B5520}
.sync.warn{color:var(--coral);border-color:var(--coral-deep)}

/* ---------- responsive entry grids (override inline templates) ---------- */
@media(max-width:760px){
  .entry{grid-template-columns:1fr 1fr !important}
}
@media(max-width:440px){
  .entry{grid-template-columns:1fr !important}
  .masthead{align-items:flex-start}
  .wave-pick{width:100%;justify-content:space-between}
  .wave-pick select{flex:1;max-width:none;margin-left:8px}
}

/* ============================================================
   黑機身 × 科技感（2026-11 改版）
   ============================================================ */
body{
  background:
    radial-gradient(70% 45% at 20% 0%, rgba(62,198,224,.07), transparent 60%),
    radial-gradient(circle, rgba(120,170,180,.11) 1px, transparent 1.4px) 0 0 / 22px 22px,
    var(--ink);
  background-attachment:fixed;
}
.wrap{max-width:1180px}
.brand h1{font-weight:400;letter-spacing:.06em}
.brand .sub{font-family:var(--mono);color:var(--dim);letter-spacing:.24em}
nav.tabs button{letter-spacing:.08em}
nav.tabs button[aria-selected="true"]{color:var(--foam);border-bottom-color:var(--coral)}
.wave-pick select{border-radius:2px}
.sync{border-radius:2px;font-family:var(--mono)}
.panel,.verdict,.agent,.gcard{position:relative;border-radius:3px;background:rgba(24,27,29,.86)}
.panel,.agent{border-color:var(--line-soft)}
.panel::before,.panel::after,.verdict::before,.verdict::after,.agent::before,.agent::after,.gcard::before,.gcard::after{
  content:"";position:absolute;width:14px;height:14px;border:0 solid var(--cyan);opacity:.7;pointer-events:none;transition:width .3s var(--ease),height .3s var(--ease),opacity .3s}
.panel::before,.verdict::before,.agent::before,.gcard::before{left:-1px;top:-1px;border-width:1px 0 0 1px}
.panel::after,.verdict::after,.agent::after,.gcard::after{right:-1px;bottom:-1px;border-width:0 1px 1px 0}
.panel:hover::before,.panel:hover::after{width:24px;height:24px;opacity:1}
.mcard,.cblock,.ctext,.agent .amet div,.why{border-radius:2px}
.mcard .mv{font-family:var(--disp);font-weight:300}
button.act,button.ghost,input,select,textarea{border-radius:2px}
button.act{color:#1a0b05}
.verdict.green .vtitle{color:var(--cyan)}
.eyebrow{font-family:var(--mono);letter-spacing:.24em}
th{font-family:var(--mono)}

/* 總覽 */
.ov-grid{display:grid;gap:14px;margin-bottom:14px}
.ov-r1{grid-template-columns:1fr 300px}
.ov-r2{grid-template-columns:1.1fr 1fr}
.ov-r3{grid-template-columns:1fr}
@media(max-width:900px){.ov-r1,.ov-r2{grid-template-columns:1fr}}
.ov-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ov-eng{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.ov-eng b{color:var(--coral);font-weight:400;margin-right:6px}
.ov-screen{background:#000;border:1px solid #1d2a2e;box-shadow:inset 0 0 0 4px #070909,inset 0 8px 20px rgba(0,0,0,.8);padding:14px 16px 10px;position:relative;overflow:hidden}
.ov-screen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
.ov-verdict{font-size:19px;line-height:1.5;margin:4px 0 2px}
.ov-verdict.glitch{animation:ovGlitch .32s steps(3) 1}
@keyframes ovGlitch{0%{text-shadow:3px 0 rgba(255,90,31,.8),-3px 0 rgba(62,198,224,.8);transform:translateX(2px);clip-path:inset(10% 0 55% 0)}40%{text-shadow:-3px 0 rgba(255,90,31,.8),3px 0 rgba(62,198,224,.8);transform:translateX(-3px);clip-path:inset(55% 0 5% 0)}100%{text-shadow:none;transform:none;clip-path:none}}
.ov-light{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.ov-light i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.ov-light.green{color:var(--cyan)}.ov-light.amber{color:var(--gold)}.ov-light.red{color:var(--coral)}.ov-light.grey{color:var(--mist)}
.ov-spark{display:block;width:100%;height:84px;margin-top:6px;cursor:crosshair}
.ov-todo{list-style:none;margin:12px 0 0;padding:0}
.ov-todo li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line-soft);font-size:14px}
.ov-todo li span.k{font-family:var(--mono);font-size:11px;color:var(--coral);min-width:22px;padding-top:3px}
.ov-todo li button{margin-left:auto;white-space:nowrap}
.ov-radar{width:190px;height:190px;border-radius:50%;position:relative;margin:4px auto 0;cursor:help;overflow:hidden;
  background:repeating-radial-gradient(circle,transparent 0 31px,rgba(62,198,224,.25) 31px 32px),
    linear-gradient(transparent calc(50% - .5px),rgba(62,198,224,.25) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
    linear-gradient(90deg,transparent calc(50% - .5px),rgba(62,198,224,.25) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),#050809;
  box-shadow:0 0 0 1px #1d2a2e,inset 0 0 34px rgba(62,198,224,.12)}
.ov-sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(62,198,224,.5),rgba(62,198,224,0) 75deg,transparent 360deg);animation:ovSpin 4s linear infinite}
@keyframes ovSpin{to{transform:rotate(360deg)}}
.ov-blip{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#4f5f64;transition:box-shadow .5s,background .5s}
.ov-blip.new{background:#2b6f7c}.ov-blip.new.hit{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.ov-blip.hit:not(.new){background:#8fa1a6}
.ov-legend{display:flex;justify-content:center;gap:14px;margin-top:10px;font-size:12px;color:var(--mist)}
.ov-legend b{font-family:var(--mono);font-weight:400;color:var(--cyan)}
.ov-big{display:flex;align-items:flex-end;gap:16px}
.ov-dot{font-family:var(--disp);font-size:96px;line-height:.95;font-weight:700;font-variant-numeric:tabular-nums;
  background:radial-gradient(circle,var(--coral) 42%,transparent 46%) 0 0/7px 7px;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,90,31,.35))}
.ov-dot.ok{background-image:radial-gradient(circle,var(--cyan) 42%,transparent 46%);filter:drop-shadow(0 0 8px rgba(62,198,224,.35))}
.ov-delta{font-family:var(--mono);font-size:13px;line-height:1.6;padding-bottom:6px}
.ov-reads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.ov-read{background:var(--surge);padding:8px 10px;box-shadow:inset 0 -2px 0 #0b0c0d}

.ov-chart{display:block;width:100%;height:200px;cursor:crosshair}

/* 預約看板 */

@media(max-width:760px){.ov-board{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<div class="wrap">
  <header id="siteHead">
    <div class="masthead">
      <div class="brand">
        <h1>廣告作戰台</h1>
        <div class="sub">序曲音樂學院 · META ADS</div>
      </div>
      <div class="wave-pick" id="headBar" style="display:none">
        <span class="sync ok" id="syncBadge">已同步</span>
        <select id="waveSelect"></select>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
/* ============================================================
   廣告作戰台 — 資料層與判讀引擎
   ============================================================ */

/* ---------- 儲存 ---------- */
var MEM = null;
var STORE_KEY = 'xuqu_ads_v1';
var storageOK = true;

function saveState() {
  var json = JSON.stringify(S);
  try {
    localStorage.setItem(STORE_KEY, json);
  } catch (e) {
    storageOK = false;
    MEM = json;
  }
}

function loadState() {
  var raw = null;
  try {
    raw = localStorage.getItem(STORE_KEY);
  } catch (e) {
    storageOK = false;
    raw = MEM;
  }
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}

/* ---------- 日期工具 ---------- */
function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function dayDiff(a, b) {
  // b - a，以天為單位
  var da = new Date(a + 'T00:00:00');
  var db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}
function addDays(iso, n) {
  var d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function shortDate(iso) {
  if (!iso) return '—';
  var p = iso.split('-');
  return p[1].replace(/^0/, '') + '/' + p[2].replace(/^0/, '');
}
function weekdayTW(iso) {
  if (!iso) return '';
  var d = new Date(iso + 'T00:00:00');
  return ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
}

/* ---------- 數字格式 ---------- */
function money(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return 'NT$' + Math.round(n).toLocaleString('en-US');
}
function pct(n, digits) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (n * 100).toFixed(digits === undefined ? 0 : digits) + '%';
}
function num(n, digits) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toFixed(digits === undefined ? 0 : digits);
}

/* ---------- 預設波次 ---------- */
function newCampaign(name, start, end, budget) {
  return {
    id: 'c' + Date.now() + Math.floor(Math.random() * 1000),
    name: name || '新的一波',
    start: start,
    end: end,
    budget: budget || 10000,
    learningDays: 4,
    capacityWeek: 8,
    capacityTotal: 24,
    thresholds: {
      msgCostGreen: 100,
      msgCostRed: 150,
      bookRate: 0.40,
      showRate: 0.70,
      freqCap: 3,
      ctrFloor: 1.0,
      cpmCap: 300
    },
    minSample: { msg: 10, show: 5, enroll: 5 },
    decisionDays: 21,
    days: [],
    bookings: [],
    checklist: {},
    notes: ''
  };
}

function seedState() {
  var c = newCampaign('適性學習測驗｜8月免費', '2026-08-13', '2026-08-31', 10000);
  return { activeId: c.id, campaigns: [c] };
}

var S = loadState() || seedState();
if (!S.campaigns || !S.campaigns.length) S = seedState();

function C() {
  var found = null;
  for (var i = 0; i < S.campaigns.length; i++) {
    if (S.campaigns[i].id === S.activeId) found = S.campaigns[i];
  }
  if (!found) { found = S.campaigns[0]; S.activeId = found.id; }
  return found;
}

/* ============================================================
   判讀引擎
   ============================================================ */

function computeMetrics(c, asOf) {
  var today = asOf || todayISO();
  var m = {
    today: today,
    formulas: {}
  };

  /* --- 廣告帳：只算 start ~ today 之間有登錄的日子 --- */
  var spend = 0, msgs = 0;
  var cpmSum = 0, cpmN = 0, ctrSum = 0, ctrN = 0, freqLatest = null, freqDate = null;
  var loggedDates = {};
  for (var i = 0; i < c.days.length; i++) {
    var d = c.days[i];
    if (d.date > today) continue;
    if (d.spend != null || d.msgs != null) loggedDates[d.date] = true;
    spend += Number(d.spend) || 0;
    msgs += Number(d.msgs) || 0;
    if (d.cpm) { cpmSum += Number(d.cpm); cpmN++; }
    if (d.ctr) { ctrSum += Number(d.ctr); ctrN++; }
    if (d.freq && (!freqDate || d.date >= freqDate)) { freqLatest = Number(d.freq); freqDate = d.date; }
  }
  m.spend = spend;
  m.msgs = msgs;
  m.loggedDates = loggedDates;
  m.cpm = cpmN ? cpmSum / cpmN : null;
  m.ctr = ctrN ? ctrSum / ctrN : null;
  m.freq = freqLatest;

  /* --- 預約名單 --- */
  var booked = 0, dueTotal = 0, showed = 0, noshow = 0;
  var enrollDue = 0, enrolled = 0, deciding = 0;
  var trialYes = 0, trialDone = 0;
  var direct = 0, directEnrolled = 0;
  var after = emptyAfter(), afterTotal = 0;
  for (var j = 0; j < c.bookings.length; j++) {
    var b = c.bookings[j];
    if (b.bookedDate && b.bookedDate > today) continue;
    /* 看廣告私訊、沒做測驗就直接報名：只算進報名與每位學員成本，不進測驗漏斗 */
    if (b.kind === 'direct') {
      direct++;
      if (b.enrolled === true) directEnrolled++;
      continue;
    }
    booked++;
    /* 到場後沒走到報名：沒約試上或試上後沒報名 */
    if (b.status === 'showed' && (b.enrolled === false || b.trial === 'declined')) {
      afterTotal++;
      if (b.lostReason && after.hasOwnProperty(b.lostReason)) after[b.lostReason]++;
      else after.unknown++;
    }
    var due = b.testDate && b.testDate <= today;
    if (due) {
      dueTotal++;
      if (b.status === 'showed') showed++;
      else if (b.status === 'noshow') noshow++;
    }
    if (b.status === 'showed' && b.testDate) {
      var age = dayDiff(b.testDate, today);
      var tr = b.trial || 'none';
      if (tr === 'booked' || tr === 'done') trialYes++;
      if (tr === 'done') trialDone++;
      if (b.enrolled === true) { enrolled++; enrollDue++; }
      else if (b.enrolled === false) { enrollDue++; }
      else if (age >= c.decisionDays) { enrollDue++; }
      else { deciding++; }
    }
  }
  m.booked = booked;
  m.dueTotal = dueTotal;
  m.showed = showed;
  m.noshow = noshow;
  m.pendingTest = booked - dueTotal;
  m.enrollDue = enrollDue;
  m.enrolledTest = enrolled;                 // 走測驗這條路報名的
  m.direct = direct;
  m.directEnrolled = directEnrolled;
  m.enrolled = enrolled + directEnrolled;    // 全部報名（每位學員成本用這個）
  m.deciding = deciding;
  m.trialYes = trialYes;
  m.trialDone = trialDone;
  m.after = after;
  m.afterTotal = afterTotal;

  /* --- 比率（含樣本門檻） --- */
  /* --- 流失原因 --- */
  var lost = { button: 0, noreply: 0, timing: 0, age: 0, price: 0 };
  for (var k = 0; k < c.days.length; k++) {
    var dl = c.days[k].lost;
    if (!dl || c.days[k].date > today) continue;
    lost.button  += Number(dl.button)  || 0;
    lost.noreply += Number(dl.noreply) || 0;
    lost.timing  += Number(dl.timing)  || 0;
    lost.age     += Number(dl.age)     || 0;
    lost.price   += Number(dl.price)   || 0;
  }
  m.lost = lost;
  m.lostTotal = lost.button + lost.noreply + lost.timing + lost.age + lost.price;
  m.lostUnknown = Math.max(0, (msgs - booked) - m.lostTotal);

  m.msgCost = msgs >= 1 ? spend / msgs : null;
  m.msgCostReady = msgs >= c.minSample.msg;
  m.formulas.msgCost = money(spend) + ' ÷ ' + msgs + ' 則 = ' + (m.msgCost === null ? '—' : money(m.msgCost));

  m.bookRate = msgs >= 1 ? booked / msgs : null;
  m.bookRateReady = msgs >= c.minSample.msg;
  m.formulas.bookRate = booked + ' 組 ÷ ' + msgs + ' 則 = ' + pct(m.bookRate);

  m.showRate = dueTotal >= 1 ? showed / dueTotal : null;
  m.showRateReady = dueTotal >= c.minSample.show;
  m.formulas.showRate = showed + ' 人 ÷ ' + dueTotal + ' 筆已到期 = ' + pct(m.showRate) +
    (m.pendingTest > 0 ? '（另有 ' + m.pendingTest + ' 筆測驗日還沒到，不列入分母）' : '');

  m.enrollRate = enrollDue >= 1 ? enrolled / enrollDue : null;
  m.enrollRateReady = enrollDue >= c.minSample.enroll;
  m.formulas.enrollRate = enrolled + ' 人 ÷ ' + enrollDue + ' 筆已過決策期 = ' + pct(m.enrollRate) +
    (m.deciding > 0 ? '（另有 ' + m.deciding + ' 人決策中，不列入分母）' : '');

  m.trialRate = showed >= 1 ? trialYes / showed : null;
  m.trialRateReady = showed >= c.minSample.show;
  m.formulas.trialRate = trialYes + ' 組 ÷ ' + showed + ' 組已到場 = ' + pct(m.trialRate);

  m.finalRate = trialDone >= 1 ? enrolled / trialDone : null;
  m.finalRateReady = trialDone >= c.minSample.enroll;
  m.formulas.finalRate = enrolled + ' 位 ÷ ' + trialDone + ' 組試上 = ' + pct(m.finalRate);

  m.costPerBooking = booked >= 1 ? spend / booked : null;
  m.formulas.costPerBooking = money(spend) + ' ÷ ' + booked + ' 組預約 = ' + (m.costPerBooking === null ? '—' : money(m.costPerBooking));
  m.costPerShow = showed >= 1 ? spend / showed : null;
  m.formulas.costPerShow = money(spend) + ' ÷ ' + showed + ' 組到場 = ' + (m.costPerShow === null ? '—' : money(m.costPerShow));

  m.cpa = m.enrolled >= 1 ? spend / m.enrolled : null;
  m.formulas.cpa = money(spend) + ' ÷ ' + m.enrolled + ' 位 = ' + (m.cpa === null ? '—' : money(m.cpa)) +
    (directEnrolled > 0 ? '（含直接報名 ' + directEnrolled + ' 位）' : '');

  /* --- 預算與檔期 --- */
  m.budgetLeft = c.budget - spend;
  m.dayIndex = dayDiff(c.start, today) + 1;               // 第幾天（1 起算）
  m.totalDays = dayDiff(c.start, c.end) + 1;
  m.daysLeft = Math.max(0, dayDiff(today, c.end) + 1);     // 含今天
  m.suggestDaily = m.daysLeft > 0 ? m.budgetLeft / m.daysLeft : 0;
  m.planDaily = c.budget / m.totalDays;
  m.formulas.suggestDaily = money(m.budgetLeft) + ' ÷ 剩 ' + m.daysLeft + ' 天 = ' + money(m.suggestDaily) + '／天';

  /* --- 座位進度 --- */
  m.seatsTotal = c.capacityTotal;
  m.seatsLeft = Math.max(0, c.capacityTotal - booked);
  m.needPerDay = m.daysLeft > 0 ? m.seatsLeft / m.daysLeft : 0;
  m.formulas.needPerDay = '還缺 ' + m.seatsLeft + ' 組 ÷ 剩 ' + m.daysLeft + ' 天 = 每天要進 ' + num(m.needPerDay, 1) + ' 組';

  /* --- 每週產能：依 testDate 分組，以 c.start 為第一週起點 --- */
  var weeks = [];
  var totalWeeks = Math.ceil(m.totalDays / 7);
  var wmap = {}, wAny = false;
  for (var wi = 0; wi < c.bookings.length; wi++) {
    var wb = c.bookings[wi];
    if (!wb.testDate) continue;
    if (wb.bookedDate && wb.bookedDate > today) continue;
    var woff = dayDiff(c.start, wb.testDate);
    if (woff < 0) continue;
    var wk = Math.floor(woff / 7);
    wmap[wk] = (wmap[wk] || 0) + 1;
    wAny = true;
    if (wk + 1 > totalWeeks) totalWeeks = wk + 1;
  }
  if (wAny && c.capacityWeek) {
    for (var wj = 0; wj < totalWeeks; wj++) {
      var wcnt = wmap[wj] || 0;
      weeks.push({
        idx: wj + 1,
        s: addDays(c.start, wj * 7),
        e: addDays(c.start, wj * 7 + 6),
        count: wcnt,
        cap: c.capacityWeek,
        over: wcnt > c.capacityWeek
      });
    }
  }
  m.weeks = weeks;

  /* --- 階段 --- */
  /* --- 決策中、待跟進 --- */
  var queue = [];
  for (var q = 0; q < c.bookings.length; q++) {
    var bb = c.bookings[q];
    if (bb.status !== 'showed' || bb.enrolled === true || bb.enrolled === false) continue;
    if (bb.follow === 'dropped') continue;
    queue.push({
      id: bb.id, name: bb.name || '（未填姓名）', age: bb.age,
      testDate: bb.testDate,
      days: bb.testDate ? dayDiff(bb.testDate, today) : null,
      follow: bb.follow || 'none',
      followDate: bb.followDate || null
    });
  }
  queue.sort(function (a, b) { return (b.days || 0) - (a.days || 0); });
  m.queue = queue;
  m.queueTodo = queue.filter(function (x) { return x.follow === 'none'; }).length;

  m.beforeStart = today < c.start;
  m.afterEnd = today > c.end;
  m.learningUntil = addDays(c.start, c.learningDays - 1);
  m.inLearning = !m.beforeStart && today <= m.learningUntil;
  m.full = booked >= c.capacityTotal;

  m.verdict = diagnose(c, m);
  return m;
}

function diagnose(c, m) {
  var t = c.thresholds;

  if (m.beforeStart) {
    return {
      level: 'idle',
      title: '還沒開跑',
      line: '距離開跑還有 ' + dayDiff(m.today, c.start) + ' 天。',
      todo: ['把「設定」頁的上線前檢查清單打勾完成', '素材、文案、訊息流程先設好', '不要提早開跑，檔期算好比較好判讀']
    };
  }

  if (m.afterEnd) {
    return {
      level: 'idle',
      title: '檔期已結束',
      line: '這一波跑完了。到「歷史」頁把成績留下來，下一波才有比較基準。',
      todo: ['把還沒回填的到場／報名結果補完', '在「歷史」頁看這波的每則訊息成本與每位學員成本']
    };
  }

  if (m.full) {
    return {
      level: 'full',
      title: '額滿了，去把廣告暫停',
      line: '已收 ' + m.booked + ' 組預約，達到 ' + m.seatsTotal + ' 組上限。繼續跑只會累積約不到的名單。',
      todo: ['到廣告管理員把廣告組暫停', '剩下的預算留給下一波', '把時間花在確認到場，不是繼續買訊息']
    };
  }

  if (m.inLearning) {
    return {
      level: 'learning',
      title: '學習期，什麼都不要動',
      line: '第 ' + m.dayIndex + ' 天，學習期到 ' + shortDate(m.learningUntil) + ' 為止。這幾天的成本數字不算數，Meta 還在找人。',
      todo: [
        '不要改受眾、預算、素材、文案——改一次就重跑學習期',
        '照常每天登錄數字，但不要看結論',
        '每小時整點掃一次訊息收件匣'
      ]
    };
  }

  if (!m.msgCostReady) {
    return {
      level: 'thin',
      title: '資料還不夠，先不判讀',
      line: '目前累積 ' + m.msgs + ' 則訊息，要滿 ' + c.minSample.msg + ' 則數字才會穩定。現在的成本會亂跳。',
      todo: ['繼續跑，繼續登錄', '每小時整點掃一次訊息收件匣']
    };
  }

  var out = [];

  // 訊息成本過高
  if (m.msgCost > t.msgCostRed) {
    var why = [];
    var act = [];
    if (m.freq !== null && m.freq >= t.freqCap) {
      why.push('頻率 ' + num(m.freq, 1) + '（超過 ' + t.freqCap + '）：同一批家長被洗太多次了，這不是素材的錯，是受眾用完了');
      act.push('把地點半徑從 4 公里放寬到 5 公里，這是唯一該動受眾的時機');
    }
    if (m.ctr !== null && m.ctr < t.ctrFloor) {
      why.push('點擊率 ' + num(m.ctr, 2) + '%（低於 ' + t.ctrFloor + '%）：影片前 3 秒或文案前 2 行沒抓住人');
      act.push('關掉表現最差的那一組主文案（廣告編輯裡刪掉那個文字選項，不要動廣告組）');
    }
    if (m.cpm !== null && m.cpm > t.cpmCap) {
      why.push('CPM ' + money(m.cpm) + '（超過 ' + money(t.cpmCap) + '）：受眾太窄，Meta 投不出去');
      act.push('檢查是不是誤設了興趣或性別，這波應該全部留空');
    }
    if (!why.length) {
      why.push('CPM／點擊率／頻率沒填，看不出是哪一種貴。到廣告管理員抄這三個數字，10 秒。');
      act.push('先關掉表現最差的那一組主文案');
    }
    out.push({
      level: 'red',
      title: '每則訊息成本過高',
      line: '目前 ' + money(m.msgCost) + '，超過 ' + money(t.msgCostRed) + ' 的紅線。',
      why: why,
      todo: act
    });
  }

  // 訊息→預約率過低
  if (m.bookRateReady && m.bookRate < t.bookRate) {
    out.push({
      level: 'red',
      title: '訊息進來了，但約不到人',
      line: '訊息→預約率 ' + pct(m.bookRate) + '，低於 ' + pct(t.bookRate) + '。人是廣告帶進來的，卡在對話。',
      why: [m.lostTotal > 0
        ? '流失原因裡最多的是「' + (function () {
            var r = [['只按按鈕', m.lost.button], ['真人未回覆', m.lost.noreply], ['時段不合', m.lost.timing], ['年齡不符', m.lost.age], ['價格', m.lost.price]];
            r.sort(function (a, b) { return b[1] - a[1]; });
            return r[0][0];
          })() + '」，先修這一項。'
        : '還沒登記流失原因，先到「記錄」頁填幾天，才知道要修哪裡。',
        '廣告已經把人帶到門口了，問題在門口之後。'],
      todo: [
        '確認廣告層級的歡迎訊息有設（不是粉專預設那則菜單）',
        '自己用另一支手機從廣告點進去走一次完整流程',
        '檢查是不是又在一開始就問了姓名＋年齡＋性別＋時間四個欄位',
        '確認「這兩段都不行」這個選項還在，不要讓人只能關掉視窗'
      ]
    });
  }

  // 到場率過低
  if (m.showRateReady && m.showRate < t.showRate) {
    out.push({
      level: 'amber',
      title: '約到了，但人沒來',
      line: '到場率 ' + pct(m.showRate) + '（' + m.showed + '／' + m.dueTotal + '），低於 ' + pct(t.showRate) + '。',
      why: ['免費的東西爽約成本是零，提醒機制就是全部。'],
      todo: [
        '測驗前一天下午發提醒訊息，寫明日期、時間、樓層、捷運出口',
        '預約確認完成後就邀請加 LINE，提醒才有第二條路',
        '爽約的那幾位隔天補一則訊息問要不要改期，不要直接放掉'
      ]
    });
  }

  // 測驗 → 試上 過低（最大流失通常在這一階）
  if (m.trialRateReady && m.trialRate !== null && m.trialRate < 0.40) {
    out.push({
      level: 'red',
      title: '測驗做完了，但約不到試上',
      line: '測驗→試上 ' + pct(m.trialRate) + '（' + m.trialYes + '／' + m.showed + '），低於 40%。',
      why: ['這一階要繳 1,000 元訂金並綁定固定時段，家長在開學期間最容易卡在「不敢決定時間」。'],
      todo: ['訂金照收，但把時段和訂金脫鉤——先繳訂金，時段等課表確定再排']
    });
  }

  // 黃燈：成本偏高但未破紅線
  if (m.msgCost > t.msgCostGreen && m.msgCost <= t.msgCostRed) {
    out.push({
      level: 'amber',
      title: '成本偏高，但還在容忍範圍',
      line: '目前 ' + money(m.msgCost) + '，落在 ' + money(t.msgCostGreen) + '–' + money(t.msgCostRed) + ' 之間。',
      why: ['這個區間最容易做錯事：手癢去調設定，結果重跑學習期，反而更貴。'],
      todo: ['觀察，不動作', '把 CPM／點擊率／頻率填進來，明天才知道往哪個方向修']
    });
  }

  if (!out.length) {
    return {
      level: 'green',
      title: '一切正常，照常跑',
      line: '每則訊息成本 ' + money(m.msgCost) + '，訊息→預約率 ' + pct(m.bookRate) + '。都在目標內。',
      todo: [
        '不要動任何設定',
        '每小時整點掃一次訊息收件匣',
        '把昨天到場的結果回填到預約名單'
      ]
    };
  }

  // 取最嚴重的當主結論，其餘列為次要
  var rank = { red: 0, amber: 1 };
  out.sort(function (a, b) { return rank[a.level] - rank[b.level]; });
  var main = out[0];
  main.also = out.slice(1);
  return main;
}

function rpc(fn, args) {
  return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(args || {})
  }).catch(function () {
    throw new Error('網路連不到，請確認裝置有連上網路');
  }).then(function (r) {
    return r.text().then(function (txt) {
      var data = null;
      try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
      if (!r.ok) {
        var msg = (data && data.message) ? data.message : ('HTTP ' + r.status);
        if (data && data.hint) msg += '（' + data.hint + '）';
        var err = new Error(msg); err.status = r.status; err.payload = data; throw err;
      }
      return data;
    });
  });
}

function setToken(t) {
  TOKEN = t;
  try { if (t) localStorage.setItem(TOK_KEY, t); else localStorage.removeItem(TOK_KEY); } catch (e) {}
}

function setSync(s, msg) { SYNC = s; SYNC_MSG = msg || ''; paintSync(); }

    offline: ['離線，稍後重試', 'warn'],
    error: [SYNC_MSG || '同步失敗', 'warn']
  };
  var v = map[SYNC] || map.idle;
  el.textContent = v[0];
  el.className = 'sync ' + v[1];
}

/* ---------- 同步 ---------- */
function schedulePush() {
  if (AUTH !== 'ready' || CONFLICT) return;
  setSync('saving');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, 700);
}

function doPush() {
  if (AUTH !== 'ready' || CONFLICT) return;
  var payload = JSON.parse(JSON.stringify(S));
  rpc('ads_push', { tok: TOKEN, new_state: payload, base_version: SRV_VERSION })
    .then(function (res) {
      if (res && res.ok) {
        SRV_VERSION = res.version;
        setSync('saved');
        setTimeout(function () { if (SYNC === 'saved') setSync('idle'); }, 1500);
      } else if (res && res.reason === 'conflict') {
        return rpc('ads_pull', { tok: TOKEN }).then(function (p) {
          CONFLICT = { mine: payload, theirs: p.state, version: p.version };
          setSync('error', '版本衝突');
          render();
        });
      }
    })
    .catch(function (e) {
      if (e.message === 'invalid_session') { signOut(true); return; }
      setSync('offline');
    });
}

function pullNow(silent) {
  if (AUTH !== 'ready' || CONFLICT) return Promise.resolve();
  return rpc('ads_pull', { tok: TOKEN }).then(function (p) {
    if (p.version !== SRV_VERSION) {
      SRV_VERSION = p.version;
      if (p.state && p.state.campaigns && p.state.campaigns.length) {
        S = p.state; saveState(); render();
        if (!silent) toast('已載入其他裝置的更新');
      }
    }
    setSync('idle');
  }).catch(function (e) {
    if (e.message === 'invalid_session') { signOut(true); return; }
    setSync('offline');
  });
}

function tick() {
  if (AUTH !== 'ready' || CONFLICT) return;
  if (SYNC === 'offline') doPush();   // 離線時累積的變更，恢復連線就補送
  else pullNow(true);
  loadAgent();
}

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(tick, 30000);
  window.addEventListener('focus', tick);
  window.addEventListener('online', tick);
}

function adoptServer(p) {

function applySuggestion(s) {
  var p = s.payload || {};
  if (s.type === 'add_booking') {
    var c = agentCampaign(p.campaignId);
    var dup = c.bookings.some(function (b) {
      return (b.name || '').trim() === (p.name || '').trim() && b.testDate === p.testDate;
    });
    if (!dup) {
      c.bookings.push({
        id: 'b' + Date.now() + Math.floor(Math.random() * 999),
        bookedDate: p.bookedDate || p.testDate, testDate: p.testDate,
        name: p.name || '', age: p.age == null ? null : Number(p.age),
        status: 'pending', enrolled: null, note: p.note || '', fromAgent: true
      });
    }
    return true;
  }
  if (s.type === 'lost') {
    var c2 = agentCampaign(p.campaignId);
    if (!p.date || ['button', 'noreply', 'timing', 'age', 'price'].indexOf(p.key) < 0) return false;
    var idx = -1;
    for (var i = 0; i < c2.days.length; i++) if (c2.days[i].date === p.date) idx = i;
    if (idx < 0) { c2.days.push({ date: p.date, spend: null, msgs: null, cpm: null, ctr: null, freq: null, lost: emptyLost() }); idx = c2.days.length - 1; }
    var L = c2.days[idx].lost || emptyLost();
    L[p.key] = (Number(L[p.key]) || 0) + 1;
    c2.days[idx].lost = L;
    return true;
  }
  return true; // info：只是記錄判斷，不改名單
}

var RC_STATUS = [['todo', '還沒聯絡'], ['sent', '已傳訊息'], ['replied', '有回覆'], ['booked', '約成了'], ['no', '不用了']];
var RC_DEFAULT_TPL = '您好，我是序曲音樂學院 😊 {name}之前來做過適性學習測驗，謝謝你們！寒假快到了，我們開了寒假體驗課，想先問問{name}最近對音樂還有興趣嗎？如果想再來玩玩看，我可以先幫你們保留時段。';

/* 所有波次加總，給漏斗與試算器用 */
function allMetrics() {
  var t = { spend: 0, msgs: 0, booked: 0, dueTotal: 0, showed: 0, trialYes: 0, enrolledTest: 0, enrolled: 0 };
  var per = [];
  S.campaigns.forEach(function (c) {
    var m = computeMetrics(c);
    ['spend', 'msgs', 'booked', 'dueTotal', 'showed', 'trialYes', 'enrolledTest', 'enrolled'].forEach(function (k) { t[k] += Number(m[k]) || 0; });
    per.push({ c: c, m: m });
  });
  t.rMsgBook = t.msgs ? t.booked / t.msgs : null;
  t.rBookShow = t.dueTotal ? t.showed / t.dueTotal : null;
  t.rShowTrial = t.showed ? t.trialYes / t.showed : null;
  t.rTrialEnroll = t.trialYes ? t.enrolledTest / t.trialYes : null;
  t.msgCost = t.msgs ? t.spend / t.msgs : null;
  t.cpa = t.enrolled ? t.spend / t.enrolled : null;
  t.per = per;
  return t;
}

/* 回訪名單：所有波次中，到場做過測驗、但還沒報名的家庭 */
function recontactList() {
  var out = [];
  S.campaigns.forEach(function (c) {
    c.bookings.forEach(function (b) {
      if (b.kind === 'direct' || b.status !== 'showed' || b.enrolled === true) return;
      out.push({ c: c, b: b, st: (b.recontact && b.recontact.status) || 'todo' });
    });
  });
  out.sort(function (a, b) { return (b.b.testDate || '') < (a.b.testDate || '') ? -1 : 1; });
  return out;
}
function ageBand(age) {
  var a = Number(age);
  if (!a) return 'unknown';
  if (a <= 6) return 'young';
  if (a <= 9) return 'mid';
  return 'old';
}
function fillTpl(b) {
  var tpl = S.recontactTpl || RC_DEFAULT_TPL;
  var nm = (b.name || '').replace(/\s*(男|女)$/, '').trim() || '孩子';
  return tpl.replace(/\{name\}/g, nm).replace(/\{age\}/g, b.age || '');
}

/* 看板欄位：依現有欄位（status／trial／enrolled）判斷在哪一關 */
var BOARD_COLS = [['pending', '待測驗'], ['showed', '到場'], ['trial', '試上'], ['enrolled', '報名'], ['lost', '沒成']];
function boardCol(b) {
  if (b.enrolled === true) return 'enrolled';
  if (b.status === 'noshow' || b.enrolled === false || b.trial === 'declined') return 'lost';
  if (b.status === 'showed' && (b.trial === 'booked' || b.trial === 'done')) return 'trial';
  if (b.status === 'showed') return 'showed';
  return 'pending';
}
function moveToCol(b, col) {
  if (col === 'pending') { b.status = 'pending'; b.trial = 'none'; b.enrolled = null; }
  else if (col === 'showed') { b.status = 'showed'; b.trial = 'none'; b.enrolled = null; }
  else if (col === 'trial') { b.status = 'showed'; if (b.trial !== 'done') b.trial = 'booked'; b.enrolled = null; }
  else if (col === 'enrolled') { b.status = 'showed'; b.trial = 'done'; b.enrolled = true; }
  else if (col === 'lost') { if (b.status === 'showed') b.enrolled = false; else b.status = 'noshow'; }
}

function ovTip(e, html) {
  var t = document.getElementById('ovTip');
  if (!t) { t = document.createElement('div'); t.id = 'ovTip'; t.className = 'ov-tip'; document.body.appendChild(t); }
  t.innerHTML = html; t.classList.add('on');
  t.style.left = Math.min(e.clientX + 14, window.innerWidth - t.offsetWidth - 8) + 'px';
  t.style.top = (e.clientY + 14) + 'px';
}
function ovTipOff() { var t = document.getElementById('ovTip'); if (t) t.classList.remove('on'); }

function viewOverview(c, m) {

  var todos = [];

  h += '</div>';

  h += '<div class="panel" style="margin:0">';
  h += '<div class="ov-head"><span class="ov-eng"><b>01</b>REACH · 新觸及</span><span class="ov-eng">AGENT</span></div>';
  if (met.new_reach != null) {
    h += '<div class="ov-radar" id="ovRadar"><div class="ov-sweep"></div></div>';
    h += '<div class="ov-legend"><span>● 新面孔 <b>' + met.new_reach + '%</b></span><span style="color:var(--dim)">● 看過的人 ' + (100 - met.new_reach) + '%</span></div>';
    h += '<p class="tiny muted" style="margin:8px 0 0;text-align:center">' + (met.new_reach < 50 ? '低於 50%：受眾大多看過了，要換素材或換受眾' : '新面孔還夠，受眾沒用完') + '</p>';
  } else {
    h += '<p class="tiny muted">等雲端 agent 的下一份報告，就會顯示這一波還有多少新面孔。</p>';
  }
  h += '</div></div>';

  /* ── 第二排：主角數字｜LED 漏斗 ── */
  var red = c.thresholds.msgCostRed, green = c.thresholds.msgCostGreen;
  var mc = m.msgCost;
  var over = mc != null && red ? (mc - red) / red : null;
  h += '<div class="ov-grid ov-r2">';
  h += '<div class="panel" style="margin:0">';
  h += '<div class="ov-head"><span class="ov-eng"><b>02</b>COST / MSG · 這一波每則訊息成本</span><span class="ov-eng">LIMIT ' + red + '</span></div>';
  h += '<div class="ov-big"><div class="ov-dot' + (mc != null && mc <= green ? ' ok' : '') + '" id="ovHero" data-to="' + (mc == null ? 0 : Math.round(mc)) + '">' + (mc == null ? '—' : '0') + '</div>';

    '<br>綠線 ' + green + '・紅線 ' + red + '<br>所有波次平均 ' + (A.msgCost == null ? '—' : Math.round(A.msgCost)) + '</div></div>';
  h += '<div class="ov-reads">' +
    '<div class="ov-read" data-ovtip="這一波累計花費"><span>SPEND</span><b>' + Math.round(m.spend).toLocaleString('en-US') + '</b></div>' +

    '</div></div>';

  var F = [['訊息', A.msgs], ['預約', A.booked], ['到場', A.showed], ['試上', A.trialYes], ['報名', A.enrolledTest]];
  /* 測驗之後（到場、試上、報名）哪一關掉最多：這段在教室手上，最值得修 */
  var worst = -1, worstRate = 2;
  for (var fi = 2; fi < F.length; fi++) {
    if (!F[fi - 1][1]) continue;
    var rr = F[fi][1] / F[fi - 1][1];
    if (rr < worstRate) { worstRate = rr; worst = fi; }
  }
  h += '<div class="panel" style="margin:0">';
  h += '<div class="ov-head"><span class="ov-eng"><b>03</b>FUNNEL · 所有波次累計</span><span class="ov-eng">CONV</span></div>';
  h += F.map(function (f, i) {

    return '<div class="ov-meter' + (i === worst ? ' leak' : '') + '" data-ovtip="' + esc(tip) + '" data-on="' + Math.max(f[1] ? 1 : 0, Math.round((f[1] / Math.max(1, F[0][1])) * 22)) + '"><span>' + f[0] + '</span><div class="ov-seg">' + new Array(23).join('<i></i>') + '</div><b>' + f[1] + '</b><em>' + rate + '</em></div>';
  }).join('');
  h += '</div></div>';

  /* ── 試算器 ── */
  var conv0 = A.rShowTrial == null ? 0.32 : A.rShowTrial;
  if (OV.conv == null) OV.conv = Math.round(conv0 * 100);
  h += '<div class="ov-grid ov-r3"><div class="panel" style="margin:0">';
  h += '<div class="ov-head"><span class="ov-eng"><b>04</b>SIMULATOR · 轉動旋鈕：測驗後接得好，可以省多少廣告費</span><span class="ov-eng">DRAG / SCROLL</span></div>';
  h += '<div class="ov-sim"><div class="ov-dial" id="ovDial" role="slider" tabindex="0" aria-label="測驗到試上的轉換率" aria-valuemin="10" aria-valuemax="80">' +
    '<svg viewBox="0 0 140 140" id="ovTicks"></svg><div class="ov-knob"><div class="ov-ptr" id="ovPtr"></div><div class="ov-val" id="ovVal"></div></div></div>';
  h += '<div><p style="margin:0;font-size:15px">測驗 → 試上 <span class="num" style="color:var(--cyan)" id="ovConv"></span>（實際 ' + Math.round(conv0 * 100) + '%，其他轉換率用你的真實數字）</p>';
  h += '<div class="ov-outs"><div class="ov-out"><span>每月需要訊息</span><b id="ovMsg">—</b></div><div class="ov-out"><span>每月需要測驗</span><b id="ovTest">—</b></div><div class="ov-out"><span>每月廣告費</span><b id="ovCost">—</b></div></div>';
  h += '<div class="ov-ctl"><span>每月目標新生</span><span class="ov-step"><button id="ovMinus" aria-label="減少">−</button><b id="ovTarget">' + OV.target + '</b><button id="ovPlus" aria-label="增加">＋</button></span>' +
    '<span>每則訊息成本</span><span class="ov-segbtn" id="ovCpm">' +
    '<button data-k="all"' + (OV.cpmKey === 'all' ? ' class="on"' : '') + '>全部平均 ' + (A.msgCost == null ? '—' : Math.round(A.msgCost)) + '</button>' +
    '<button data-k="red"' + (OV.cpmKey === 'red' ? ' class="on"' : '') + '>紅線 ' + red + '</button>' +
    '<button data-k="now"' + (OV.cpmKey === 'now' ? ' class="on"' : '') + '>這一波 ' + (mc == null ? '—' : Math.round(mc)) + '</button></span></div>';
  h += '<p style="margin:10px 0 0;font-size:14px" id="ovSave"></p></div></div>';
  h += '</div></div>';

  /* ── 回訪清單 ── */
  h += '<div class="panel" id="ovRc">';
  h += '<div class="ov-head"><span class="ov-eng"><b>05</b>RECONTACT · 回訪名單（測驗過、還沒報名）</span><span class="ov-eng">' + rc.length + ' 戶</span></div>';
  h += '<p class="lede">這些家庭已經認識序曲、孩子來過教室，比廣告受眾更容易報名。複製訊息貼到 LINE 或 Messenger，傳完記得按「已傳」。</p>';
  h += '<details class="rc-tpl"><summary>編輯訊息範本（{name} 會換成孩子的名字）</summary><div class="dbody"><textarea id="rcTpl" rows="4">' + esc(S.recontactTpl || RC_DEFAULT_TPL) + '</textarea>' +
    '<div class="btns" style="margin-top:8px"><button class="act" id="rcTplSave">儲存範本</button><button class="ghost" id="rcTplReset">恢復預設</button></div></div></details>';
  h += '<div class="rc-filter" style="margin-top:12px"><span class="ov-segbtn" id="rcBand">' +
    [['all', '全部'], ['young', '6 歲以下'], ['mid', '7–9 歲'], ['old', '10 歲以上']].map(function (x) {

    }).join('') + '</span>' +
    '<label class="tiny muted" style="display:inline-flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="rcShowDone" style="width:auto"' + (OV.rcShowDone ? ' checked' : '') + '>也顯示已約成／不用了</label></div>';
  var rows = rc.filter(function (x) {
    if (!OV.rcShowDone && (x.st === 'booked' || x.st === 'no')) return false;
    return OV.rcFilter === 'all' || ageBand(x.b.age) === OV.rcFilter;

  if (!rows.length) h += '<p class="tiny muted">這個篩選下沒有名單。</p>';
  rows.forEach(function (x) {
    var b = x.b, rcv = b.recontact || {};
    var stHit = RC_STATUS.filter(function (s) { return s[0] === x.st; })[0];
    var stName = stHit ? stHit[1] : '還沒聯絡';
    var reason = b.lostReason ? (AFTER_REASONS.filter(function (r) { return r[0] === b.lostReason; })[0] || [0, ''])[1] : '';
    h += '<div class="rc-row"><div><b style="font-weight:600">' + esc(b.name || '（未填姓名）') + '</b><div class="tiny muted">' + esc(x.c.name) + '</div></div>' +
      '<div class="num">' + (b.age ? b.age + ' 歲' : '—') + '</div>' +
      '<div class="tiny">測驗 ' + shortDate(b.testDate) + (reason ? '<br><span class="muted">' + esc(reason) + '</span>' : '') + '</div>' +
      '<div class="st rc-st-' + x.st + '">' + stName + (rcv.date ? '　' + shortDate(rcv.date) : '') + '</div>' +
      '<div class="rc-acts"><button class="ghost" data-rccopy="' + b.id + '">複製訊息</button>' +
      (x.st === 'todo' ? '<button class="act" data-rcset="' + b.id + ':sent">已傳</button>' : '') +
      (x.st === 'sent' ? '<button class="ghost" data-rcset="' + b.id + ':replied">有回覆</button>' : '') +
      (x.st === 'sent' || x.st === 'replied' ? '<button class="act" data-rcset="' + b.id + ':booked">約成了</button>' : '') +
      (x.st !== 'no' && x.st !== 'booked' ? '<button class="ghost" data-rcset="' + b.id + ':no">不用了</button>' : '<button class="ghost" data-rcset="' + b.id + ':todo">重來</button>') +
      '</div></div>';
  });
  h += '</div>';

  /* ── 預約看板（這一波）── */
  h += '<div class="panel" id="ovBoard">';

  h += '<div class="ov-board">' + BOARD_COLS.map(function (col) {
