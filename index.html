<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>廣告作戰台｜序曲音樂學院</title>
<style>
:root{
  --ink:#04212A; --sea:#0A2F3A; --surge:#10404E; --line:#1A5763; --line-soft:#123B47;
  --foam:#E9F3F2; --mist:#7DA5AB; --dim:#4E7C84;
  --coral:#F2705F; --coral-deep:#8C3A33; --coral-soft:#3A1F1D;
  --gold:#E8B54B; --gold-soft:#3A3018;
  --kelp:#46B995; --kelp-soft:#0F3A31;
  --sans:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Hiragino Sans",sans-serif;
  --mono:Consolas,"SF Mono",Menlo,ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--foam);
  font-family:var(--sans); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}

.wrap{max-width:1000px;margin:0 auto;padding:0 20px 100px}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--line-soft); margin-bottom:26px}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 0 18px;flex-wrap:wrap}
.brand h1{
  margin:0; font-size:26px; font-weight:800; letter-spacing:-.03em;
}
.brand .sub{color:var(--mist);font-size:12.5px;letter-spacing:.14em;margin-top:3px}
.wave-pick{display:flex;align-items:center;gap:8px}
.wave-pick label{white-space:nowrap;margin:0}
.wave-pick select{
  background:var(--sea); color:var(--foam); border:1px solid var(--line);
  border-radius:7px; padding:8px 11px; font-family:var(--sans); font-size:13.5px; max-width:260px;
}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--mist); font-family:var(--sans); font-size:14.5px; font-weight:600;
  padding:9px 15px; cursor:pointer; letter-spacing:.02em;
}
nav.tabs button:hover{color:var(--foam)}
nav.tabs button[aria-selected="true"]{color:var(--coral);border-bottom-color:var(--coral)}
nav.tabs button:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}

/* ---------- generic ---------- */
.panel{background:var(--sea);border:1px solid var(--line-soft);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.panel > h2{margin:0 0 4px;font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.panel > .lede{color:var(--mist);font-size:13.5px;margin:0 0 16px}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:700;margin-bottom:9px}
.hr{height:1px;background:var(--line-soft);margin:18px 0}
.muted{color:var(--mist)}
.tiny{font-size:12.5px}

button.act{
  background:var(--coral);color:#25100C;border:none;border-radius:7px;
  padding:9px 16px;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;
}
button.act:hover{filter:brightness(1.08)}
button.ghost{
  background:transparent;color:var(--mist);border:1px solid var(--line);border-radius:7px;
  padding:8px 14px;font-family:var(--sans);font-size:13.5px;cursor:pointer;
}
button.ghost:hover{color:var(--foam);border-color:var(--dim)}
button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

input,select,textarea{
  background:var(--ink);color:var(--foam);border:1px solid var(--line);
  border-radius:6px;padding:8px 10px;font-family:var(--sans);font-size:14px;width:100%;
}
input.num-in{font-family:var(--mono);text-align:right}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--coral)}
label.fld{display:block;font-size:12px;color:var(--mist);margin-bottom:4px;letter-spacing:.04em}

/* ---------- verdict ---------- */
.verdict{border-radius:14px;padding:22px 24px;margin-bottom:16px;border:1px solid}
.verdict .vtitle{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:6px 0 6px}
.verdict .vline{font-size:14.5px;margin:0 0 14px}
.verdict.green{background:var(--kelp-soft);border-color:#1E6E5C}
.verdict.green .vtitle{color:var(--kelp)}
.verdict.amber{background:var(--gold-soft);border-color:#6B5520}
.verdict.amber .vtitle{color:var(--gold)}
.verdict.red,.verdict.full{background:var(--coral-soft);border-color:var(--coral-deep)}
.verdict.red .vtitle,.verdict.full .vtitle{color:var(--coral)}
.verdict.learning,.verdict.thin,.verdict.idle{background:var(--surge);border-color:var(--line)}
.verdict.learning .vtitle,.verdict.thin .vtitle,.verdict.idle .vtitle{color:var(--foam)}
.vlabel{font-size:11px;letter-spacing:.22em;font-weight:700;opacity:.8}

.todo{list-style:none;margin:0;padding:0}
.todo li{position:relative;padding-left:20px;margin-bottom:6px;font-size:14px}
.todo li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.why{background:rgba(0,0,0,.22);border-radius:8px;padding:11px 14px;margin:0 0 14px;font-size:13.5px}
.why p{margin:0 0 5px}.why p:last-child{margin:0}
.also{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.also .at{font-weight:700;font-size:14px;margin-bottom:3px}

/* ---------- seat grid (signature) ---------- */
.seats{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:14px 0 10px}
.seat{aspect-ratio:1/1.15;border-radius:4px 4px 7px 7px;border:1.5px solid var(--line);background:transparent;position:relative}
.seat.booked{border-color:var(--coral)}
.seat.showed{background:var(--coral);border-color:var(--coral)}
.seat.over{border-style:dashed;border-color:var(--gold)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mist)}
.legend i{display:inline-block;width:11px;height:12px;border-radius:3px 3px 5px 5px;border:1.5px solid var(--line);vertical-align:-2px;margin-right:5px}
.legend i.b{border-color:var(--coral)} .legend i.s{background:var(--coral);border-color:var(--coral)}

/* ---------- day strip ---------- */
.strip{display:flex;gap:3px;margin:10px 0 8px;flex-wrap:wrap}
.dcell{flex:1 0 22px;min-width:22px;text-align:center;border-radius:5px;padding:5px 0 4px;
  background:var(--surge);border:1px solid transparent;font-size:10.5px;color:var(--dim)}
.dcell .dn{font-family:var(--mono);font-size:11px;display:block;line-height:1.25}
.dcell.learn{background:var(--line-soft)}
.dcell.has{color:var(--foam);border-color:var(--line)}
.dcell.today{border-color:var(--coral);color:var(--coral);background:var(--coral-soft)}
.dcell.future{opacity:.45}

/* ---------- metric cards ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.mcard{background:var(--surge);border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px}
.mcard .mk{font-size:12px;color:var(--mist);letter-spacing:.05em}
.mcard .mv{font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin:2px 0}
.mcard .mv.g{color:var(--kelp)} .mcard .mv.a{color:var(--gold)} .mcard .mv.r{color:var(--coral)}
.mcard .mv.n{color:#557F87}
.mcard .mf{font-size:11.5px;color:var(--dim);font-family:var(--mono);line-height:1.55;overflow-wrap:anywhere}
.mcard .mt{font-size:11.5px;color:var(--mist);margin-top:5px}
.mcard .lock{font-size:11.5px;color:var(--gold);margin-top:5px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.13em;color:var(--dim);font-weight:700;
   padding:0 8px 8px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.tscroll{overflow-x:auto}
.rowbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 6px;font-family:var(--sans)}
.rowbtn:hover{color:var(--coral)}

/* ---------- entry row ---------- */
.entry{display:grid;gap:10px;align-items:end}
.entry.day{grid-template-columns:1.3fr .9fr .9fr .8fr .8fr .8fr auto}
.entry.book{grid-template-columns:1.2fr 1.2fr 1.4fr .7fr auto}
@media(max-width:860px){.entry.day,.entry.book{grid-template-columns:1fr 1fr}}

/* ---------- copy blocks ---------- */
.cblock{background:var(--surge);border:1px solid var(--line-soft);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.chead .cl{font-weight:800;font-size:15px}
.chead .ct{font-size:11px;letter-spacing:.14em;color:var(--coral);font-weight:700}
.cnote{font-size:12.5px;color:var(--mist);margin:0 0 10px}
.ctext{background:var(--ink);border:1px solid var(--line-soft);border-radius:7px;padding:13px 15px;
  white-space:pre-wrap;font-size:13.5px;line-height:1.8;margin-bottom:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 12px;
  font-size:12.5px;color:var(--foam);background:var(--sea);margin:0 6px 6px 0}
.pill.off{color:var(--dim);text-decoration:line-through;border-style:dashed}
.pill.on{border-color:var(--kelp);color:var(--kelp)}

details{background:var(--sea);border:1px solid var(--line-soft);border-radius:8px;padding:0;margin-top:8px}
details summary{cursor:pointer;padding:9px 14px;font-size:13px;color:var(--mist);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"為什麼 ▸ ";color:var(--dim);font-size:12px}
details[open] summary::before{content:"為什麼 ▾ "}
details .dbody{padding:0 14px 13px;font-size:13.5px;color:var(--foam);line-height:1.75}

/* ---------- checklist ---------- */
.chk{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:14px}
.chk input{width:17px;height:17px;flex:0 0 17px;margin-top:4px;accent-color:var(--coral)}
.chk.done span{color:var(--dim);text-decoration:line-through}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:var(--coral);color:#25100C;font-weight:700;font-size:14px;
  padding:11px 22px;border-radius:9px;opacity:0;transition:.22s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none}
.warnbar{background:var(--gold-soft);border:1px solid #6B5520;color:var(--gold);
  border-radius:9px;padding:11px 15px;font-size:13px;margin-bottom:16px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:620px){
  .seats{grid-template-columns:repeat(8,1fr)}
  .brand h1{font-size:21px}
  .wrap{padding:0 14px 80px}
}

/* ---------- login gate ---------- */
.gate{display:flex;align-items:center;justify-content:center;min-height:78vh;padding:20px 0}
.gcard{background:var(--sea);border:1px solid var(--line-soft);border-radius:16px;
  padding:32px 30px;width:100%;max-width:390px}
.glogo{font-size:24px;font-weight:800;letter-spacing:-.03em}
.gsub{color:var(--mist);font-size:11.5px;letter-spacing:.16em;margin-top:3px;margin-bottom:20px}
.gnote{font-size:13.5px;color:var(--mist);margin:0 0 18px;line-height:1.7}
.gbtn{width:100%;margin-top:18px;padding:12px}
.gwarn{font-size:12px;color:var(--gold);margin:14px 0 0;line-height:1.6}
.gerr{font-size:13px;color:var(--coral);margin:12px 0 0;font-weight:600}

/* ---------- sync badge ---------- */
.sync{font-size:11.5px;letter-spacing:.06em;padding:3px 10px;border-radius:999px;
  border:1px solid var(--line);color:var(--mist);white-space:nowrap}
.sync.ok{color:var(--kelp);border-color:#1E6E5C}
.sync.busy{color:var(--gold);border-color:#6B5520}
.sync.warn{color:var(--coral);border-color:var(--coral-deep)}

/* ---------- responsive entry grids (override inline templates) ---------- */
@media(max-width:760px){
  .entry{grid-template-columns:1fr 1fr !important}
}
@media(max-width:440px){
  .entry{grid-template-columns:1fr !important}
  .masthead{align-items:flex-start}
  .wave-pick{width:100%;justify-content:space-between}
  .wave-pick select{flex:1;max-width:none;margin-left:8px}
}

</style>
</head>
<body>
<div class="wrap">
  <header id="siteHead">
    <div class="masthead">
      <div class="brand">
        <h1>廣告作戰台</h1>
        <div class="sub">序曲音樂學院 · META ADS</div>
      </div>
      <div class="wave-pick" id="headBar" style="display:none">
        <span class="sync ok" id="syncBadge">已同步</span>
        <select id="waveSelect"></select>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
/* ============================================================
   廣告作戰台 — 資料層與判讀引擎
   ============================================================ */

/* ---------- 儲存 ---------- */
var MEM = null;
var STORE_KEY = 'xuqu_ads_v1';
var storageOK = true;

function saveState() {
  var json = JSON.stringify(S);
  try {
    localStorage.setItem(STORE_KEY, json);
  } catch (e) {
    storageOK = false;
    MEM = json;
  }
}

function loadState() {
  var raw = null;
  try {
    raw = localStorage.getItem(STORE_KEY);
  } catch (e) {
    storageOK = false;
    raw = MEM;
  }
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}

/* ---------- 日期工具 ---------- */
function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function dayDiff(a, b) {
  // b - a，以天為單位
  var da = new Date(a + 'T00:00:00');
  var db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}
function addDays(iso, n) {
  var d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function shortDate(iso) {
  if (!iso) return '—';
  var p = iso.split('-');
  return p[1].replace(/^0/, '') + '/' + p[2].replace(/^0/, '');
}
function weekdayTW(iso) {
  if (!iso) return '';
  var d = new Date(iso + 'T00:00:00');
  return ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
}

/* ---------- 數字格式 ---------- */
function money(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return 'NT$' + Math.round(n).toLocaleString('en-US');
}
function pct(n, digits) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (n * 100).toFixed(digits === undefined ? 0 : digits) + '%';
}
function num(n, digits) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toFixed(digits === undefined ? 0 : digits);
}

/* ---------- 預設波次 ---------- */
function newCampaign(name, start, end, budget) {
  return {
    id: 'c' + Date.now() + Math.floor(Math.random() * 1000),
    name: name || '新的一波',
    start: start,
    end: end,
    budget: budget || 10000,
    learningDays: 4,
    capacityWeek: 8,
    capacityTotal: 24,
    thresholds: {
      msgCostGreen: 100,
      msgCostRed: 150,
      bookRate: 0.40,
      showRate: 0.70,
      freqCap: 3,
      ctrFloor: 1.0,
      cpmCap: 300
    },
    minSample: { msg: 10, show: 5, enroll: 5 },
    decisionDays: 21,
    days: [],
    bookings: [],
    checklist: {},
    notes: ''
  };
}

function seedState() {
  var c = newCampaign('適性學習測驗｜8月免費', '2026-08-13', '2026-08-31', 10000);
  return { activeId: c.id, campaigns: [c] };
}

var S = loadState() || seedState();
if (!S.campaigns || !S.campaigns.length) S = seedState();

function C() {
  var found = null;
  for (var i = 0; i < S.campaigns.length; i++) {
    if (S.campaigns[i].id === S.activeId) found = S.campaigns[i];
  }
  if (!found) { found = S.campaigns[0]; S.activeId = found.id; }
  return found;
}

/* ============================================================
   判讀引擎
   ============================================================ */

function computeMetrics(c, asOf) {
  var today = asOf || todayISO();
  var m = {
    today: today,
    formulas: {}
  };

  /* --- 廣告帳：只算 start ~ today 之間有登錄的日子 --- */
  var spend = 0, msgs = 0;
  var cpmSum = 0, cpmN = 0, ctrSum = 0, ctrN = 0, freqLatest = null, freqDate = null;
  var loggedDates = {};
  for (var i = 0; i < c.days.length; i++) {
    var d = c.days[i];
    if (d.date > today) continue;
    if (d.spend != null || d.msgs != null) loggedDates[d.date] = true;
    spend += Number(d.spend) || 0;
    msgs += Number(d.msgs) || 0;
    if (d.cpm) { cpmSum += Number(d.cpm); cpmN++; }
    if (d.ctr) { ctrSum += Number(d.ctr); ctrN++; }
    if (d.freq && (!freqDate || d.date >= freqDate)) { freqLatest = Number(d.freq); freqDate = d.date; }
  }
  m.spend = spend;
  m.msgs = msgs;
  m.loggedDates = loggedDates;
  m.cpm = cpmN ? cpmSum / cpmN : null;
  m.ctr = ctrN ? ctrSum / ctrN : null;
  m.freq = freqLatest;

  /* --- 預約名單 --- */
  var booked = 0, dueTotal = 0, showed = 0, noshow = 0;
  var enrollDue = 0, enrolled = 0, deciding = 0;
  var trialYes = 0, trialDone = 0;
  for (var j = 0; j < c.bookings.length; j++) {
    var b = c.bookings[j];
    if (b.bookedDate && b.bookedDate > today) continue;
    booked++;
    var due = b.testDate && b.testDate <= today;
    if (due) {
      dueTotal++;
      if (b.status === 'showed') showed++;
      else if (b.status === 'noshow') noshow++;
    }
    if (b.status === 'showed' && b.testDate) {
      var age = dayDiff(b.testDate, today);
      var tr = b.trial || 'none';
      if (tr === 'booked' || tr === 'done') trialYes++;
      if (tr === 'done') trialDone++;
      if (b.enrolled === true) { enrolled++; enrollDue++; }
      else if (b.enrolled === false) { enrollDue++; }
      else if (age >= c.decisionDays) { enrollDue++; }
      else { deciding++; }
    }
  }
  m.booked = booked;
  m.dueTotal = dueTotal;
  m.showed = showed;
  m.noshow = noshow;
  m.pendingTest = booked - dueTotal;
  m.enrollDue = enrollDue;
  m.enrolled = enrolled;
  m.deciding = deciding;
  m.trialYes = trialYes;
  m.trialDone = trialDone;

  /* --- 比率（含樣本門檻） --- */
  /* --- 流失原因 --- */
  var lost = { button: 0, noreply: 0, timing: 0, age: 0, price: 0 };
  for (var k = 0; k < c.days.length; k++) {
    var dl = c.days[k].lost;
    if (!dl || c.days[k].date > today) continue;
    lost.button  += Number(dl.button)  || 0;
    lost.noreply += Number(dl.noreply) || 0;
    lost.timing  += Number(dl.timing)  || 0;
    lost.age     += Number(dl.age)     || 0;
    lost.price   += Number(dl.price)   || 0;
  }
  m.lost = lost;
  m.lostTotal = lost.button + lost.noreply + lost.timing + lost.age + lost.price;
  m.lostUnknown = Math.max(0, (msgs - booked) - m.lostTotal);

  m.msgCost = msgs >= 1 ? spend / msgs : null;
  m.msgCostReady = msgs >= c.minSample.msg;
  m.formulas.msgCost = money(spend) + ' ÷ ' + msgs + ' 則 = ' + (m.msgCost === null ? '—' : money(m.msgCost));

  m.bookRate = msgs >= 1 ? booked / msgs : null;
  m.bookRateReady = msgs >= c.minSample.msg;
  m.formulas.bookRate = booked + ' 組 ÷ ' + msgs + ' 則 = ' + pct(m.bookRate);

  m.showRate = dueTotal >= 1 ? showed / dueTotal : null;
  m.showRateReady = dueTotal >= c.minSample.show;
  m.formulas.showRate = showed + ' 人 ÷ ' + dueTotal + ' 筆已到期 = ' + pct(m.showRate) +
    (m.pendingTest > 0 ? '（另有 ' + m.pendingTest + ' 筆測驗日還沒到，不列入分母）' : '');

  m.enrollRate = enrollDue >= 1 ? enrolled / enrollDue : null;
  m.enrollRateReady = enrollDue >= c.minSample.enroll;
  m.formulas.enrollRate = enrolled + ' 人 ÷ ' + enrollDue + ' 筆已過決策期 = ' + pct(m.enrollRate) +
    (m.deciding > 0 ? '（另有 ' + m.deciding + ' 人決策中，不列入分母）' : '');

  m.trialRate = showed >= 1 ? trialYes / showed : null;
  m.trialRateReady = showed >= c.minSample.show;
  m.formulas.trialRate = trialYes + ' 組 ÷ ' + showed + ' 組已到場 = ' + pct(m.trialRate);

  m.finalRate = trialDone >= 1 ? enrolled / trialDone : null;
  m.finalRateReady = trialDone >= c.minSample.enroll;
  m.formulas.finalRate = enrolled + ' 位 ÷ ' + trialDone + ' 組試上 = ' + pct(m.finalRate);

  m.costPerBooking = booked >= 1 ? spend / booked : null;
  m.formulas.costPerBooking = money(spend) + ' ÷ ' + booked + ' 組預約 = ' + (m.costPerBooking === null ? '—' : money(m.costPerBooking));
  m.costPerShow = showed >= 1 ? spend / showed : null;
  m.formulas.costPerShow = money(spend) + ' ÷ ' + showed + ' 組到場 = ' + (m.costPerShow === null ? '—' : money(m.costPerShow));

  m.cpa = enrolled >= 1 ? spend / enrolled : null;
  m.formulas.cpa = money(spend) + ' ÷ ' + enrolled + ' 位 = ' + (m.cpa === null ? '—' : money(m.cpa));

  /* --- 預算與檔期 --- */
  m.budgetLeft = c.budget - spend;
  m.dayIndex = dayDiff(c.start, today) + 1;               // 第幾天（1 起算）
  m.totalDays = dayDiff(c.start, c.end) + 1;
  m.daysLeft = Math.max(0, dayDiff(today, c.end) + 1);     // 含今天
  m.suggestDaily = m.daysLeft > 0 ? m.budgetLeft / m.daysLeft : 0;
  m.planDaily = c.budget / m.totalDays;
  m.formulas.suggestDaily = money(m.budgetLeft) + ' ÷ 剩 ' + m.daysLeft + ' 天 = ' + money(m.suggestDaily) + '／天';

  /* --- 座位進度 --- */
  m.seatsTotal = c.capacityTotal;
  m.seatsLeft = Math.max(0, c.capacityTotal - booked);
  m.needPerDay = m.daysLeft > 0 ? m.seatsLeft / m.daysLeft : 0;
  m.formulas.needPerDay = '還缺 ' + m.seatsLeft + ' 組 ÷ 剩 ' + m.daysLeft + ' 天 = 每天要進 ' + num(m.needPerDay, 1) + ' 組';

  /* --- 每週產能：依 testDate 分組，以 c.start 為第一週起點 --- */
  var weeks = [];
  var totalWeeks = Math.ceil(m.totalDays / 7);
  var wmap = {}, wAny = false;
  for (var wi = 0; wi < c.bookings.length; wi++) {
    var wb = c.bookings[wi];
    if (!wb.testDate) continue;
    if (wb.bookedDate && wb.bookedDate > today) continue;
    var woff = dayDiff(c.start, wb.testDate);
    if (woff < 0) continue;
    var wk = Math.floor(woff / 7);
    wmap[wk] = (wmap[wk] || 0) + 1;
    wAny = true;
    if (wk + 1 > totalWeeks) totalWeeks = wk + 1;
  }
  if (wAny && c.capacityWeek) {
    for (var wj = 0; wj < totalWeeks; wj++) {
      var wcnt = wmap[wj] || 0;
      weeks.push({
        idx: wj + 1,
        s: addDays(c.start, wj * 7),
        e: addDays(c.start, wj * 7 + 6),
        count: wcnt,
        cap: c.capacityWeek,
        over: wcnt > c.capacityWeek
      });
    }
  }
  m.weeks = weeks;

  /* --- 階段 --- */
  /* --- 決策中、待跟進 --- */
  var queue = [];
  for (var q = 0; q < c.bookings.length; q++) {
    var bb = c.bookings[q];
    if (bb.status !== 'showed' || bb.enrolled === true || bb.enrolled === false) continue;
    if (bb.follow === 'dropped') continue;
    queue.push({
      id: bb.id, name: bb.name || '（未填姓名）', age: bb.age,
      testDate: bb.testDate,
      days: bb.testDate ? dayDiff(bb.testDate, today) : null,
      follow: bb.follow || 'none',
      followDate: bb.followDate || null
    });
  }
  queue.sort(function (a, b) { return (b.days || 0) - (a.days || 0); });
  m.queue = queue;
  m.queueTodo = queue.filter(function (x) { return x.follow === 'none'; }).length;

  m.beforeStart = today < c.start;
  m.afterEnd = today > c.end;
  m.learningUntil = addDays(c.start, c.learningDays - 1);
  m.inLearning = !m.beforeStart && today <= m.learningUntil;
  m.full = booked >= c.capacityTotal;

  m.verdict = diagnose(c, m);
  return m;
}

function diagnose(c, m) {
  var t = c.thresholds;

  if (m.beforeStart) {
    return {
      level: 'idle',
      title: '還沒開跑',
      line: '距離開跑還有 ' + dayDiff(m.today, c.start) + ' 天。',
      todo: ['把「設定」頁的上線前檢查清單打勾完成', '素材、文案、訊息流程先設好', '不要提早開跑，檔期算好比較好判讀']
    };
  }

  if (m.afterEnd) {
    return {
      level: 'idle',
      title: '檔期已結束',
      line: '這一波跑完了。到「歷史」頁把成績留下來，下一波才有比較基準。',
      todo: ['把還沒回填的到場／報名結果補完', '在「歷史」頁看這波的每則訊息成本與每位學員成本']
    };
  }

  if (m.full) {
    return {
      level: 'full',
      title: '額滿了，去把廣告暫停',
      line: '已收 ' + m.booked + ' 組預約，達到 ' + m.seatsTotal + ' 組上限。繼續跑只會累積約不到的名單。',
      todo: ['到廣告管理員把廣告組暫停', '剩下的預算留給下一波', '把時間花在確認到場，不是繼續買訊息']
    };
  }

  if (m.inLearning) {
    return {
      level: 'learning',
      title: '學習期，什麼都不要動',
      line: '第 ' + m.dayIndex + ' 天，學習期到 ' + shortDate(m.learningUntil) + ' 為止。這幾天的成本數字不算數，Meta 還在找人。',
      todo: [
        '不要改受眾、預算、素材、文案——改一次就重跑學習期',
        '照常每天登錄數字，但不要看結論',
        '每小時整點掃一次訊息收件匣'
      ]
    };
  }

  if (!m.msgCostReady) {
    return {
      level: 'thin',
      title: '資料還不夠，先不判讀',
      line: '目前累積 ' + m.msgs + ' 則訊息，要滿 ' + c.minSample.msg + ' 則數字才會穩定。現在的成本會亂跳。',
      todo: ['繼續跑，繼續登錄', '每小時整點掃一次訊息收件匣']
    };
  }

  var out = [];

  // 訊息成本過高
  if (m.msgCost > t.msgCostRed) {
    var why = [];
    var act = [];
    if (m.freq !== null && m.freq >= t.freqCap) {
      why.push('頻率 ' + num(m.freq, 1) + '（超過 ' + t.freqCap + '）：同一批家長被洗太多次了，這不是素材的錯，是受眾用完了');
      act.push('把地點半徑從 4 公里放寬到 5 公里，這是唯一該動受眾的時機');
    }
    if (m.ctr !== null && m.ctr < t.ctrFloor) {
      why.push('點擊率 ' + num(m.ctr, 2) + '%（低於 ' + t.ctrFloor + '%）：影片前 3 秒或文案前 2 行沒抓住人');
      act.push('關掉表現最差的那一組主文案（廣告編輯裡刪掉那個文字選項，不要動廣告組）');
    }
    if (m.cpm !== null && m.cpm > t.cpmCap) {
      why.push('CPM ' + money(m.cpm) + '（超過 ' + money(t.cpmCap) + '）：受眾太窄，Meta 投不出去');
      act.push('檢查是不是誤設了興趣或性別，這波應該全部留空');
    }
    if (!why.length) {
      why.push('CPM／點擊率／頻率沒填，看不出是哪一種貴。到廣告管理員抄這三個數字，10 秒。');
      act.push('先關掉表現最差的那一組主文案');
    }
    out.push({
      level: 'red',
      title: '每則訊息成本過高',
      line: '目前 ' + money(m.msgCost) + '，超過 ' + money(t.msgCostRed) + ' 的紅線。',
      why: why,
      todo: act
    });
  }

  // 訊息→預約率過低
  if (m.bookRateReady && m.bookRate < t.bookRate) {
    out.push({
      level: 'red',
      title: '訊息進來了，但約不到人',
      line: '訊息→預約率 ' + pct(m.bookRate) + '，低於 ' + pct(t.bookRate) + '。人是廣告帶進來的，卡在對話。',
      why: [m.lostTotal > 0
        ? '流失原因裡最多的是「' + (function () {
            var r = [['只按按鈕', m.lost.button], ['真人未回覆', m.lost.noreply], ['時段不合', m.lost.timing], ['年齡不符', m.lost.age], ['價格', m.lost.price]];
            r.sort(function (a, b) { return b[1] - a[1]; });
            return r[0][0];
          })() + '」，先修這一項。'
        : '還沒登記流失原因，先到「記錄」頁填幾天，才知道要修哪裡。',
        '廣告已經把人帶到門口了，問題在門口之後。'],
      todo: [
        '確認廣告層級的歡迎訊息有設（不是粉專預設那則菜單）',
        '自己用另一支手機從廣告點進去走一次完整流程',
        '檢查是不是又在一開始就問了姓名＋年齡＋性別＋時間四個欄位',
        '確認「這兩段都不行」這個選項還在，不要讓人只能關掉視窗'
      ]
    });
  }

  // 到場率過低
  if (m.showRateReady && m.showRate < t.showRate) {
    out.push({
      level: 'amber',
      title: '約到了，但人沒來',
      line: '到場率 ' + pct(m.showRate) + '（' + m.showed + '／' + m.dueTotal + '），低於 ' + pct(t.showRate) + '。',
      why: ['免費的東西爽約成本是零，提醒機制就是全部。'],
      todo: [
        '測驗前一天下午發提醒訊息，寫明日期、時間、樓層、捷運出口',
        '預約確認完成後就邀請加 LINE，提醒才有第二條路',
        '爽約的那幾位隔天補一則訊息問要不要改期，不要直接放掉'
      ]
    });
  }

  // 測驗 → 試上 過低（最大流失通常在這一階）
  if (m.trialRateReady && m.trialRate !== null && m.trialRate < 0.40) {
    out.push({
      level: 'red',
      title: '測驗做完了，但約不到試上',
      line: '測驗→試上 ' + pct(m.trialRate) + '（' + m.trialYes + '／' + m.showed + '），低於 40%。',
      why: ['這一階要繳 1,000 元訂金並綁定固定時段，家長在開學期間最容易卡在「不敢決定時間」。'],
      todo: ['訂金照收，但把時段和訂金脫鉤——先繳訂金，時段等課表確定再排']
    });
  }

  // 黃燈：成本偏高但未破紅線
  if (m.msgCost > t.msgCostGreen && m.msgCost <= t.msgCostRed) {
    out.push({
      level: 'amber',
      title: '成本偏高，但還在容忍範圍',
      line: '目前 ' + money(m.msgCost) + '，落在 ' + money(t.msgCostGreen) + '–' + money(t.msgCostRed) + ' 之間。',
      why: ['這個區間最容易做錯事：手癢去調設定，結果重跑學習期，反而更貴。'],
      todo: ['觀察，不動作', '把 CPM／點擊率／頻率填進來，明天才知道往哪個方向修']
    });
  }

  if (!out.length) {
    return {
      level: 'green',
      title: '一切正常，照常跑',
      line: '每則訊息成本 ' + money(m.msgCost) + '，訊息→預約率 ' + pct(m.bookRate) + '。都在目標內。',
      todo: [
        '不要動任何設定',
        '每小時整點掃一次訊息收件匣',
        '把昨天到場的結果回填到預約名單'
      ]
    };
  }

  // 取最嚴重的當主結論，其餘列為次要
  var rank = { red: 0, amber: 1 };
  out.sort(function (a, b) { return rank[a.level] - rank[b.level]; });
  var main = out[0];
  main.also = out.slice(1);
  return main;
}

function rpc(fn, args) {
  return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(args || {})
  }).catch(function () {
    throw new Error('網路連不到，請確認裝置有連上網路');
  }).then(function (r) {
    return r.text().then(function (txt) {
      var data = null;
      try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
      if (!r.ok) {
        var msg = (data && data.message) ? data.message : ('HTTP ' + r.status);
        if (data && data.hint) msg += '（' + data.hint + '）';
        var err = new Error(msg); err.status = r.status; err.payload = data; throw err;
      }
      return data;
    });
  });
}

function setToken(t) {
  TOKEN = t;
  try { if (t) localStorage.setItem(TOK_KEY, t); else localStorage.removeItem(TOK_KEY); } catch (e) {}
}

function setSync(s, msg) { SYNC = s; SYNC_MSG = msg || ''; paintSync(); }

function paintSync() {
  var el = document.getElementById('syncBadge');
  if (!el) return;
  var map = {
    idle: ['已同步', 'ok'],
    saving: ['儲存中…', 'busy'],
    saved: ['已儲存', 'ok'],
    offline: ['離線，稍後重試', 'warn'],
    error: [SYNC_MSG || '同步失敗', 'warn']
  };
  var v = map[SYNC] || map.idle;
  el.textContent = v[0];
  el.className = 'sync ' + v[1];
}

/* ---------- 同步 ---------- */
function schedulePush() {
  if (AUTH !== 'ready' || CONFLICT) return;
  setSync('saving');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, 700);
}

function doPush() {
  if (AUTH !== 'ready' || CONFLICT) return;
  var payload = JSON.parse(JSON.stringify(S));
  rpc('ads_push', { tok: TOKEN, new_state: payload, base_version: SRV_VERSION })
    .then(function (res) {
      if (res && res.ok) {
        SRV_VERSION = res.version;
        setSync('saved');
        setTimeout(function () { if (SYNC === 'saved') setSync('idle'); }, 1500);
      } else if (res && res.reason === 'conflict') {
        return rpc('ads_pull', { tok: TOKEN }).then(function (p) {
          CONFLICT = { mine: payload, theirs: p.state, version: p.version };
          setSync('error', '版本衝突');
          render();
        });
      }
    })
    .catch(function (e) {
      if (e.message === 'invalid_session') { signOut(true); return; }
      setSync('offline');
    });
}

function pullNow(silent) {
  if (AUTH !== 'ready' || CONFLICT) return Promise.resolve();
  return rpc('ads_pull', { tok: TOKEN }).then(function (p) {
    if (p.version !== SRV_VERSION) {
      SRV_VERSION = p.version;
      if (p.state && p.state.campaigns && p.state.campaigns.length) {
        S = p.state; saveState(); render();
        if (!silent) toast('已載入其他裝置的更新');
      }
    }
    setSync('idle');
  }).catch(function (e) {
    if (e.message === 'invalid_session') { signOut(true); return; }
    setSync('offline');
  });
}

function tick() {
  if (AUTH !== 'ready' || CONFLICT) return;
  if (SYNC === 'offline') doPush();   // 離線時累積的變更，恢復連線就補送
  else pullNow(true);
}

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(tick, 30000);
  window.addEventListener('focus', tick);
  window.addEventListener('online', tick);
}

function boot() {
  AUTH = 'boot';
  renderGate();
  if (TOKEN) {
    rpc('ads_pull', { tok: TOKEN })
      .then(function (p) { adoptServer(p); })
      .catch(function () {
        setToken(null);
        decideGate();
      });
  } else {
    decideGate();
  }
}

function decideGate() {
  rpc('ads_is_initialized', {})
    .then(function (init) { AUTH = init ? 'login' : 'setup'; renderGate(); })
    .catch(function (e) { AUTH = 'login'; AUTH_ERR = '連不上伺服器：' + e.message; renderGate(); });
}

function adoptServer(p) {
  SRV_VERSION = p.version || 0;
  if (p.state && p.state.campaigns && p.state.campaigns.length) {
    S = p.state;
  } else {
    var cached = loadState();
    S = (cached && cached.campaigns && cached.campaigns.length) ? cached : seedState();
  }
  saveState();
  AUTH = 'ready';
  render();
  startPolling();
  if (SRV_VERSION === 0) schedulePush();
}

function signOut(expired) {
  setToken(null);
  clearInterval(pollTimer);
  AUTH = 'login';
  AUTH_ERR = expired ? '登入已過期，請重新輸入密碼' : '';
  renderGate();
}

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
  } else {
    fallbackCopy(txt, done);
  }
}
function fallbackCopy(txt, done) {
  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { toast('複製失敗，請手動選取'); }
  document.body.removeChild(ta);
}

  }
  h += '<div class="eyebrow" style="margin-bottom:7px">現在該做的事</div>';
  h += '<ul class="todo">' + m.verdict.todo.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
  if (m.verdict.also && m.verdict.also.length) {
    h += '<div class="also"><div class="eyebrow">同時還有</div>';
    m.verdict.also.forEach(function (a) {
      h += '<div class="at">' + esc(a.title) + '</div>';
      h += '<p class="tiny muted" style="margin:0 0 8px">' + esc(a.line) + '</p>';
      h += '<ul class="todo">' + a.todo.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    });
    h += '</div>';
  }
  h += '</div>';

  /* 座位表 */
  var seats = '';
  var showedN = m.showed, bookedN = m.booked;
  for (var i = 0; i < Math.max(c.capacityTotal, bookedN); i++) {
    var cls = 'seat';
    if (i < showedN) cls += ' showed';
    else if (i < bookedN) cls += ' booked';
    if (i >= c.capacityTotal) cls += ' over';
    seats += '<div class="' + cls + '"></div>';
  }
  h += '<div class="panel">';
  h += '<div class="eyebrow">測驗座位</div>';
  h += '<h2><span class="num">' + bookedN + '</span> / ' + c.capacityTotal + ' 組已預約，其中 <span class="num">' + showedN + '</span> 組已到場</h2>';
  h += '<div class="seats">' + seats + '</div>';
  h += '<div class="legend"><span><i class="s"></i>已到場</span><span><i class="b"></i>已預約，還沒到</span><span><i></i>空位</span></div>';
  h += '<p class="tiny muted" style="margin:12px 0 0">' + esc(m.formulas.needPerDay) + '</p>';

  /* 每週產能 */
  if (m.weeks && m.weeks.length) {
    h += '<div class="hr"></div><div class="eyebrow">每週產能　一週最多 ' + c.capacityWeek + ' 組</div>';
    h += '<div class="tscroll"><table><thead><tr><th>週次</th><th>測驗日區間</th>' +
      '<th style="text-align:right">已排</th><th style="text-align:right">上限</th><th>狀態</th></tr></thead><tbody>';
    m.weeks.forEach(function (w) {
      var stateTxt;
      if (w.over) stateTxt = '超收 ' + (w.count - w.cap) + ' 組';
      else if (w.count === w.cap) stateTxt = '剛好滿';
      else stateTxt = '還有 ' + (w.cap - w.count) + ' 個';
      h += '<tr' + (w.over ? ' style="color:var(--gold)"' : '') + '>';
      h += '<td>第 ' + w.idx + ' 週</td>';
      h += '<td class="num tiny">' + shortDate(w.s) + '–' + shortDate(w.e) + '</td>';
      h += '<td class="n">' + w.count + '</td>';
      h += '<td class="n">' + w.cap + '</td>';
      h += '<td' + (w.over ? ' style="font-weight:700"' : '') + '>' + stateTxt + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  /* 日期條 */
  var strip = '';
  for (var d = 0; d < m.totalDays; d++) {
    var iso = addDays(c.start, d);
    var cls2 = 'dcell';
    if (d < c.learningDays) cls2 += ' learn';
    if (m.loggedDates[iso]) cls2 += ' has';
    if (iso === m.today) cls2 += ' today';
    if (iso > m.today) cls2 += ' future';
    strip += '<div class="' + cls2 + '" title="' + iso + '"><span class="dn">' + shortDate(iso).split('/')[1] + '</span>' + weekdayTW(iso) + '</div>';
  }
  h += '<div class="hr"></div><div class="eyebrow">檔期　前 ' + c.learningDays + " 天為學習期</div>";
  h += '<div class="strip">' + strip + '</div>';
  h += '</div>';

  /* 指標卡 */
  var t = c.thresholds;
  function card(k, val, tone, formula, tail, locked) {
    return '<div class="mcard"><div class="mk">' + k + '</div>' +
      '<div class="mv ' + (locked ? 'n' : tone) + '">' + val + '</div>' +
      '<div class="mf">' + esc(formula) + '</div>' +
      (locked ? '<div class="lock">' + esc(locked) + '</div>' : (tail ? '<div class="mt">' + esc(tail) + '</div>' : '')) +
      '</div>';
  }
  var tone1 = m.msgCost === null ? 'n' : (m.msgCost > t.msgCostRed ? 'r' : (m.msgCost > t.msgCostGreen ? 'a' : 'g'));
  var tone2 = m.bookRate === null ? 'n' : (m.bookRate < t.bookRate ? 'r' : 'g');
  var tone3 = m.showRate === null ? 'n' : (m.showRate < t.showRate ? 'a' : 'g');

  h += '<div class="panel"><div class="eyebrow">指標　結論下面就是算式</div><div class="mgrid">';
  h += card('每則訊息成本', m.msgCost === null ? '—' : money(m.msgCost), tone1, m.formulas.msgCost,
    '目標 <' + money(t.msgCostGreen) + '　紅線 ' + money(t.msgCostRed),
    m.msgCostReady ? null : '樣本不足：要滿 ' + c.minSample.msg + ' 則訊息才判讀');
  h += card('訊息 → 預約', m.bookRate === null ? '—' : pct(m.bookRate), tone2, m.formulas.bookRate,
    '目標 > ' + pct(t.bookRate),
    m.bookRateReady ? null : '樣本不足：要滿 ' + c.minSample.msg + ' 則訊息才判讀');
  h += card('預約 → 到場', m.showRate === null ? '—' : pct(m.showRate), tone3, m.formulas.showRate,
    '目標 > ' + pct(t.showRate),
    m.showRateReady ? null : '樣本不足：要滿 ' + c.minSample.show + ' 筆已到期預約才判讀');
  var toneTrial = m.trialRate === null ? 'n' : (m.trialRate < 0.40 ? 'r' : 'g');
  h += card('測驗 → 試上', m.trialRate === null ? '—' : pct(m.trialRate), toneTrial, m.formulas.trialRate,
    '目標 > 40%　最大流失通常在這一階',
    m.trialRateReady ? null : '樣本不足：要滿 ' + c.minSample.show + ' 組已到場才判讀');
  h += card('試上 → 正式', m.finalRate === null ? '—' : pct(m.finalRate), 'g', m.formulas.finalRate,
    '正式課折抵 1,000 元訂金',
    m.finalRateReady ? null : '樣本不足：要滿 ' + c.minSample.enroll + ' 組試上才判讀');
  h += card('每組預約成本', m.costPerBooking === null ? '—' : money(m.costPerBooking), 'g', m.formulas.costPerBooking,
    '當天就結算得出來', m.booked >= 1 ? null : '還沒有預約');
  h += card('每組到場成本', m.costPerShow === null ? '—' : money(m.costPerShow), 'g', m.formulas.costPerShow,
    '決策落後時看這個', m.showed >= 1 ? null : '還沒有人到場');
  h += card('每位學員成本', m.cpa === null ? '—' : money(m.cpa), 'g', m.formulas.cpa, '報名 ' + m.enrolled + ' 位',
    m.enrolled >= 1 ? null : '還沒有人報名');
  h += card('剩餘預算', money(m.budgetLeft), 'g', money(c.budget) + ' − ' + money(m.spend) + ' = ' + money(m.budgetLeft),
    m.formulas.suggestDaily + '（參考值，改日預算會重跑學習期，非必要別動）');
  h += '</div></div>';

  /* 廣告健檢 */
  h += '<div class="panel"><div class="eyebrow">選填的三個數字　填了才知道成本高是「哪一種高」</div><div class="mgrid">';
  h += card('CPM', m.cpm === null ? '未填' : money(m.cpm), m.cpm === null ? 'n' : (m.cpm > t.cpmCap ? 'a' : 'g'),
    m.cpm === null ? '到廣告管理員抄一下' : '上限參考 ' + money(t.cpmCap), m.cpm > t.cpmCap ? '偏高＝受眾太窄' : '');
  h += card('點擊率 CTR', m.ctr === null ? '未填' : num(m.ctr, 2) + '%', m.ctr === null ? 'n' : (m.ctr < t.ctrFloor ? 'a' : 'g'),
    m.ctr === null ? '到廣告管理員抄一下' : '下限參考 ' + t.ctrFloor + '%', m.ctr !== null && m.ctr < t.ctrFloor ? '偏低＝影片或前兩行沒抓住人' : '');
  h += card('頻率', m.freq === null ? '未填' : num(m.freq, 2), m.freq === null ? 'n' : (m.freq >= t.freqCap ? 'a' : 'g'),
    m.freq === null ? '到廣告管理員抄一下' : '上限參考 ' + t.freqCap, m.freq !== null && m.freq >= t.freqCap ? '偏高＝受眾被洗太多次，該放寬半徑' : '');
  h += '</div></div>';

  /* 決策中，待跟進 */
  if (m.queue.length) {
    h += '<div class="panel"><div class="eyebrow">決策中　' +
      (m.queueTodo ? '<span style="color:var(--coral)">' + m.queueTodo + ' 位還沒聯絡</span>' : '全部都聯絡過了') + '</div>';
    h += '<h2>' + m.queue.length + ' 位到場過但還沒決定</h2>';
    h += '<p class="lede">廣告費已經花掉了，這些是成本最低的潛在學員。課表定下來的那一週最適合聯絡。</p>';
    h += '<div class="tscroll"><table><thead><tr><th>姓名</th><th style="text-align:right">年齡</th>' +
      '<th>測驗日</th><th style="text-align:right">已過</th><th>跟進</th></tr></thead><tbody>';
    m.queue.forEach(function (q) {
      var late = q.days !== null && q.days >= 14 && q.follow === 'none';
      h += '<tr' + (late ? ' style="color:var(--gold)"' : '') + '>';
      h += '<td>' + esc(q.name) + '</td>';
      h += '<td class="n">' + (q.age || '—') + '</td>';
      h += '<td class="num">' + shortDate(q.testDate) + '</td>';
      h += '<td class="n">' + (q.days === null ? '—' : q.days + ' 天') + '</td>';
      h += '<td><select data-follow="' + q.id + '" style="width:auto;padding:4px 8px;font-size:13px">' +
        '<option value="none"' + (q.follow === 'none' ? ' selected' : '') + '>未聯絡</option>' +
        '<option value="contacted"' + (q.follow === 'contacted' ? ' selected' : '') + '>已聯絡</option>' +
        '<option value="replied"' + (q.follow === 'replied' ? ' selected' : '') + '>已回覆</option>' +
        '<option value="dropped"' + (q.follow === 'dropped' ? ' selected' : '') + '>放棄追蹤</option>' +
        '</select>' + (q.followDate ? '<span class="tiny muted"> ' + shortDate(q.followDate) + '</span>' : '') + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div></div>';
  }

  /* 流失原因 */
  var leaked = m.msgs - m.booked;
  if (leaked > 0) {
    h += '<div class="panel"><div class="eyebrow">流失原因　在「記錄」頁登記</div>';
    h += '<h2>' + leaked + ' 則訊息沒有變成預約</h2>';
    if (m.lostTotal === 0) {
      h += '<p class="lede">還沒有登記任何原因。不知道人是為什麼走的，就只能猜。每天花 30 秒在「記錄」頁填一下。</p>';
    } else {
      var rows = [['只按按鈕', m.lost.button], ['真人未回覆', m.lost.noreply], ['時段不合', m.lost.timing], ['年齡不符', m.lost.age], ['嫌貴／問價後消失', m.lost.price]];
      if (m.lostUnknown > 0) rows.push(['未登記', m.lostUnknown]);
      h += '<div class="tscroll"><table><thead><tr><th>原因</th><th style="text-align:right">人數</th><th style="text-align:right">佔流失</th></tr></thead><tbody>';
      rows.forEach(function (r) {
        h += '<tr><td>' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="n">' +
          (leaked ? Math.round(100 * r[1] / leaked) + '%' : '—') + '</td></tr>';
      });
      h += '</tbody></table></div>';
      var top = rows.slice(0, 4).sort(function (a, b) { return b[1] - a[1]; })[0];
      if (top && top[1] > 0 && top[1] / leaked >= 0.4) {
        var fix = {
          '未回覆': '回覆速度是關鍵。平日每小時整點掃一次收件匣，並補上 3 小時與 20 小時的挽回訊息（超過 24 小時就發不出去了）。',
          '時段不合': '時段開得不夠，或開的時段跟家長的作息對不上。先看是哪個年齡層在抱怨，再決定加開哪一段。',
          '年齡不符': '廣告把不對的人帶進來了。文案第一行要寫清楚適用年齡，讓不符合的人不要點。',
          '嫌貴／問價後消失': '價格沒有在廣告文案裡講清楚，篩選成本落到你的人力上。把價格前置到文案第一行。'
        }[top[0]];
        h += '<div class="why" style="margin-top:14px"><p><strong>' + top[0] + '</strong> 佔了流失的 ' +
          Math.round(100 * top[1] / leaked) + '%。</p><p>' + esc(fix) + '</p></div>';
      }
    }
    h += '</div>';
  }

  /* 每日例行 */
  h += '<div class="panel"><div class="eyebrow">每天只做這三件事</div><ul class="todo">' +
    DAILY_ROUTINE.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
    '</ul><p class="tiny muted" style="margin:10px 0 0">其他什麼都不要動。</p></div>';

  return h;
}

function emptyLost() { return { button: 0, noreply: 0, timing: 0, age: 0, price: 0 }; }
function lostLabel(l) {
  if (!l) return '—';
  var parts = [];
  if (l.button)  parts.push('只按 ' + l.button);
  if (l.noreply) parts.push('未回 ' + l.noreply);
  if (l.timing)  parts.push('時段 ' + l.timing);
  if (l.age)     parts.push('年齡 ' + l.age);
  if (l.price)   parts.push('價格 ' + l.price);
  return parts.length ? parts.join('、') : '—';
}

/* ---------- 記錄 ---------- */
function viewLog(c, m) {
  var h = '';

  /* 每日廣告 */
  h += '<div class="panel">';
  h += '<h2>每日廣告數字</h2>';
  h += '<p class="lede">前三個必填，後三個選填但強烈建議——沒有它們，成本高的時候看不出是哪一種高。</p>';
  h += '<div class="entry day">';
  h += '<div><label class="fld">日期（預設昨天）</label><input type="date" id="d_date" value="' + addDays(todayISO(), -1) + '"></div>';
  h += '<div><label class="fld">花費 NT$</label><input class="num-in" id="d_spend" inputmode="decimal" placeholder="520"></div>';
  h += '<div><label class="fld">訊息數</label><input class="num-in" id="d_msgs" inputmode="numeric" placeholder="6"></div>';
  h += '<div><label class="fld">CPM</label><input class="num-in" id="d_cpm" inputmode="decimal" placeholder="選填"></div>';
  h += '<div><label class="fld">CTR %</label><input class="num-in" id="d_ctr" inputmode="decimal" placeholder="選填"></div>';
  h += '<div><label class="fld">頻率</label><input class="num-in" id="d_freq" inputmode="decimal" placeholder="選填"></div>';
  h += '<div><button class="act" id="addDay">記錄</button></div>';
  h += '</div>';
  h += '<div class="eyebrow" style="margin-top:16px">這些訊息為什麼沒約成？（選填，但填了才知道要修哪裡）</div>';
  h += '<p class="tiny muted" style="margin:2px 0 8px">「只按按鈕」＝點了廣告按鈕但完全沒進對話；「真人未回覆」＝我們已經回訊、對方不讀不回。填完按「加入沒約成」，一天可以分多次持續累加。</p>';
  h += '<div class="entry" style="grid-template-columns:repeat(7,1fr)">';
  h += '<div><label class="fld">只按按鈕</label><input class="num-in" id="l_button" inputmode="numeric" placeholder="0"></div>';
  h += '<div><label class="fld">真人未回覆</label><input class="num-in" id="l_noreply" inputmode="numeric" placeholder="0"></div>';
  h += '<div><label class="fld">時段不合</label><input class="num-in" id="l_timing" inputmode="numeric" placeholder="0"></div>';
  h += '<div><label class="fld">年齡不符</label><input class="num-in" id="l_age" inputmode="numeric" placeholder="0"></div>';
  h += '<div><label class="fld">嫌貴／問價後消失</label><input class="num-in" id="l_price" inputmode="numeric" placeholder="0"></div>';
  h += '<div><label class="fld">日期</label><input type="date" id="l_date" value="' + addDays(todayISO(), -1) + '"></div>';
  h += '<div style="align-self:end"><button class="act" id="addLost">加入沒約成</button></div>';
  h += '</div>';

  var days = c.days.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  if (days.length) {
    h += '<div class="hr"></div><div class="tscroll"><table><thead><tr>' +
      '<th>日期</th><th style="text-align:right">花費</th><th style="text-align:right">訊息</th>' +
      '<th style="text-align:right">單則成本</th><th style="text-align:right">CPM</th><th style="text-align:right">CTR</th><th style="text-align:right">頻率</th><th>流失</th><th></th>' +
      '</tr></thead><tbody>';
    days.forEach(function (d) {
      var cost = d.msgs ? (d.spend / d.msgs) : null;
      h += '<tr>' +
        '<td class="num">' + shortDate(d.date) + '（' + weekdayTW(d.date) + '）</td>' +
        '<td class="n">' + money(d.spend) + '</td>' +
        '<td class="n">' + (d.msgs == null ? '—' : d.msgs) + '</td>' +
        '<td class="n">' + (cost === null ? '—' : money(cost)) + '</td>' +
        '<td class="n">' + (d.cpm ? money(d.cpm) : '—') + '</td>' +
        '<td class="n">' + (d.ctr ? num(d.ctr, 2) + '%' : '—') + '</td>' +
        '<td class="n">' + (d.freq ? num(d.freq, 2) : '—') + '</td>' +
        '<td class="tiny muted">' + lostLabel(d.lost) + '</td>' +
        '<td style="text-align:right"><button class="rowbtn" data-delday="' + d.date + '" title="刪除">✕</button></td>' +
        '</tr>';
    });
    h += '</tbody></table></div>';
  } else {
    h += '<div class="hr"></div><p class="tiny muted">還沒有任何記錄。開跑後每天早上花 30 秒把昨天的數字打進來。</p>';
  }
  h += '</div>';

  /* 預約名單 */
  h += '<div class="panel">';
  h += '<h2>預約名單</h2>';
  h += '<p class="lede">這份名單同時是你的測驗時段表。到場率只算「測驗日已經過了」的那些，所以剛預約還沒到測驗日的人不會拉低數字。</p>';
  h += '<div class="entry book">';
  h += '<div><label class="fld">預約日</label><input type="date" id="b_booked" value="' + todayISO() + '"></div>';
  h += '<div><label class="fld">測驗日</label><input type="date" id="b_test" value="' + addDays(todayISO(), 3) + '"></div>';
  h += '<div><label class="fld">孩子姓名</label><input id="b_name" placeholder="王小明"></div>';
  h += '<div><label class="fld">年齡</label><input class="num-in" id="b_age" inputmode="numeric" placeholder="7"></div>';
  h += '<div><button class="act" id="addBook">新增</button></div>';
  h += '</div>';

  var bs = c.bookings.slice().sort(function (a, b) { return (a.testDate || '') < (b.testDate || '') ? 1 : -1; });
  if (bs.length) {
    h += '<div class="hr"></div><div class="tscroll"><table><thead><tr>' +
      '<th>測驗日</th><th>姓名</th><th style="text-align:right">年齡</th><th>到場</th><th>試上</th><th>報名</th><th></th>' +
      '</tr></thead><tbody>';
    bs.forEach(function (b) {
      var due = b.testDate && b.testDate <= m.today;
      h += '<tr>';
      h += '<td class="num">' + shortDate(b.testDate) + '（' + weekdayTW(b.testDate) + '）' +
        (due ? '' : '<span class="tiny muted"> 未到期</span>') + '</td>';
      h += '<td>' + esc(b.name || '—') + '</td>';
      h += '<td class="n">' + (b.age || '—') + '</td>';
      h += '<td><select data-status="' + b.id + '" style="width:auto;padding:4px 8px;font-size:13px">' +
        '<option value="pending"' + (b.status === 'pending' ? ' selected' : '') + '>待確認</option>' +
        '<option value="showed"' + (b.status === 'showed' ? ' selected' : '') + '>已到場</option>' +
        '<option value="noshow"' + (b.status === 'noshow' ? ' selected' : '') + '>爽約</option>' +
        '</select></td>';
      h += '<td><select data-trial="' + b.id + '" style="width:auto;padding:4px 8px;font-size:13px"' +
        (b.status === 'showed' ? '' : ' disabled') + '>' +
        '<option value="none"' + (!b.trial || b.trial === 'none' ? ' selected' : '') + '>未定</option>' +
        '<option value="booked"' + (b.trial === 'booked' ? ' selected' : '') + '>已約試上</option>' +
        '<option value="done"' + (b.trial === 'done' ? ' selected' : '') + '>已試上</option>' +
        '<option value="declined"' + (b.trial === 'declined' ? ' selected' : '') + '>不試上</option>' +
        '</select></td>';
      h += '<td><select data-enroll="' + b.id + '" style="width:auto;padding:4px 8px;font-size:13px"' +
        (b.status === 'showed' ? '' : ' disabled') + '>' +
        '<option value=""' + (b.enrolled === null || b.enrolled === undefined ? ' selected' : '') + '>未定</option>' +
        '<option value="yes"' + (b.enrolled === true ? ' selected' : '') + '>已報名</option>' +
        '<option value="no"' + (b.enrolled === false ? ' selected' : '') + '>沒報名</option>' +
        '</select></td>';
      h += '<td style="text-align:right"><button class="rowbtn" data-delbook="' + b.id + '" title="刪除">✕</button></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    h += '<p class="tiny muted" style="margin:12px 0 0">已預約 ' + m.booked + ' 組｜測驗日已過 ' + m.dueTotal +

  } else {
    h += '<div class="hr"></div><p class="tiny muted">還沒有預約。每接到一組就打一列，大約 15 秒。</p>';
  }

  return h;
}

/* ============================================================
   事件
   ============================================================ */
function n(id) {
  var el = document.getElementById(id);
  if (!el) return null;
  var v = parseFloat(el.value);
  return isNaN(v) ? null : v;
}
function s(id) {
  var el = document.getElementById(id);
  return el ? el.value : '';
}

function wire() {
  var c = C();

  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.onclick = function () { TAB = b.dataset.tab; render(); window.scrollTo(0, 0); };
  });

  $('#waveSelect').onchange = function (e) { S.activeId = e.target.value; commit(); };

  document.querySelectorAll('[data-copy]').forEach(function (b) {
    b.onclick = function () {
      var k = b.dataset.copy, txt = '', label = '已複製';
      if (k.indexOf('copy_') === 0) {
        COPY_BLOCKS.forEach(function (x) { if ('copy_' + x.id === k) { txt = x.text; label = x.label; } });
      } else if (k.indexOf('msg_') === 0) {
        MSG_BLOCKS.forEach(function (x) { if ('msg_' + x.id === k) { txt = x.text; label = x.label; } });
      } else if (k.indexOf('btn_') === 0) {
        MSG_BLOCKS.forEach(function (x) { if ('btn_' + x.id === k) { txt = x.buttons.join('\n'); label = '按鈕文字'; } });
      } else if (k === 'headlines') { txt = HEADLINES.join('\n'); label = '標題'; }
      else if (k === 'desc') { txt = DESCRIPTION; label = '描述'; }
      else if (k === 'intake') { txt = NEXT_WAVE_INTAKE; label = '資料清單'; }
      copyText(txt, label);
    };
  });

  var addDayBtn = $('#addDay');
  if (addDayBtn) addDayBtn.onclick = function () {
    var date = s('d_date');
    if (!date) { toast('請選日期'); return; }
    var spend = n('d_spend'), msgs = n('d_msgs');
    if (spend === null || msgs === null) { toast('花費和訊息數要填'); return; }
    if (date >= todayISO()) {
      if (!confirm('這是今天的數字，Meta 還沒跑完整天，成本會偏高。確定要記錄嗎？')) return;
    }
    var idx = -1;
    for (var i = 0; i < c.days.length; i++) if (c.days[i].date === date) idx = i;
    var prevLost = (idx >= 0 && c.days[idx].lost) ? c.days[idx].lost : emptyLost();
    var rec = { date: date, spend: spend, msgs: msgs, cpm: n('d_cpm'), ctr: n('d_ctr'), freq: n('d_freq'), lost: prevLost };
    if (idx >= 0) { c.days[idx] = rec; toast(shortDate(date) + ' 已更新'); }
    else { c.days.push(rec); toast(shortDate(date) + ' 已記錄'); }
    commit();
  };

  var addLostBtn = $('#addLost');
  if (addLostBtn) addLostBtn.onclick = function () {
    var date = s('l_date');
    if (!date) { toast('請選日期'); return; }
    var add = { button: n('l_button') || 0, noreply: n('l_noreply') || 0, timing: n('l_timing') || 0, age: n('l_age') || 0, price: n('l_price') || 0 };
    var sum = add.button + add.noreply + add.timing + add.age + add.price;
    if (sum <= 0) { toast('填個數字再加'); return; }
    var idx = -1;
    for (var i = 0; i < c.days.length; i++) if (c.days[i].date === date) idx = i;
    if (idx < 0) {
      c.days.push({ date: date, spend: null, msgs: null, cpm: null, ctr: null, freq: null, lost: emptyLost() });
      idx = c.days.length - 1;
    }
    var L = c.days[idx].lost || emptyLost();
    L.button  = (Number(L.button)  || 0) + add.button;
    L.noreply = (Number(L.noreply) || 0) + add.noreply;
    L.timing  = (Number(L.timing)  || 0) + add.timing;
    L.age     = (Number(L.age)     || 0) + add.age;
    L.price   = (Number(L.price)   || 0) + add.price;
    c.days[idx].lost = L;
    toast(shortDate(date) + ' 已加入 ' + sum + ' 筆沒約成');
    commit();
  };

  document.querySelectorAll('[data-delday]').forEach(function (b) {
    b.onclick = function () {
      var d = b.dataset.delday;
      c.days = c.days.filter(function (x) { return x.date !== d; });
      commit();
    };
  });

  var addBookBtn = $('#addBook');
  if (addBookBtn) addBookBtn.onclick = function () {
    var bd = s('b_booked'), td = s('b_test');
    if (!bd || !td) { toast('預約日和測驗日都要填'); return; }
    c.bookings.push({
      id: 'b' + Date.now() + Math.floor(Math.random() * 999),
      bookedDate: bd, testDate: td,
      name: s('b_name'), age: n('b_age'),
      status: 'pending', enrolled: null
    });
    toast('已加入名單');
    commit();
  };

  document.querySelectorAll('[data-status]').forEach(function (sel) {
    sel.onchange = function () {
      var id = sel.dataset.status;
      c.bookings.forEach(function (b) {
        if (b.id === id) {
          b.status = sel.value;
          if (b.status !== 'showed') { b.enrolled = null; b.trial = 'none'; b.trialDate = null; }
        }
      });
      commit();
    };
  });
  document.querySelectorAll('[data-trial]').forEach(function (sel) {
    sel.onchange = function () {
      var id = sel.dataset.trial;
      c.bookings.forEach(function (b) {
        if (b.id === id) {
          b.trial = sel.value;
          b.trialDate = (sel.value === 'booked' || sel.value === 'done') ? (b.trialDate || todayISO()) : null;
        }
      });
      commit();
    };
  });
  document.querySelectorAll('[data-enroll]').forEach(function (sel) {
    sel.onchange = function () {
      var id = sel.dataset.enroll;
      c.bookings.forEach(function (b) {
        if (b.id === id) b.enrolled = sel.value === 'yes' ? true : (sel.value === 'no' ? false : null);
      });
      commit();
    };
  });
  document.querySelectorAll('[data-delbook]').forEach(function (b) {
    b.onclick = function () {
      var id = b.dataset.delbook;
      c.bookings = c.bookings.filter(function (x) { return x.id !== id; });
      commit();
    };
  });

  document.querySelectorAll('[data-follow]').forEach(function (sel) {
    sel.onchange = function () {
      var id = sel.dataset.follow;
      c.bookings.forEach(function (b) {
        if (b.id === id) {
          b.follow = sel.value;
          b.followDate = (sel.value === 'none') ? null : todayISO();
        }
      });
      commit();
    };
  });

  document.querySelectorAll('[data-chk]').forEach(function (cb) {
    cb.onchange = function () { c.checklist[cb.dataset.chk] = cb.checked; commit(); };
  });

  var saveCfg = $('#saveCfg');
  if (saveCfg) saveCfg.onclick = function () {
    c.name = s('s_name') || c.name;
    c.start = s('s_start'); c.end = s('s_end');
    c.budget = n('s_budget') || c.budget;
    c.capacityTotal = n('s_cap') || c.capacityTotal;
    c.capacityWeek = n('s_capw') || c.capacityWeek;
    c.learningDays = n('s_learn') || c.learningDays;
    toast('已儲存'); commit();
  };
  var saveTh = $('#saveTh');
  if (saveTh) saveTh.onclick = function () {
    c.thresholds.msgCostGreen = n('t_g') || c.thresholds.msgCostGreen;
    c.thresholds.msgCostRed = n('t_r') || c.thresholds.msgCostRed;
    c.thresholds.bookRate = (n('t_b') || 40) / 100;
    c.thresholds.showRate = (n('t_s') || 70) / 100;
    c.thresholds.freqCap = n('t_f') || c.thresholds.freqCap;
    c.decisionDays = n('t_d') || c.decisionDays;
    toast('門檻已更新'); commit();
  };

  var nw = $('#newWave');
  if (nw) nw.onclick = function () {
    var st = todayISO();
    var x = newCampaign('新的一波', st, addDays(st, 18), 10000);
    S.campaigns.push(x); S.activeId = x.id;
    TAB = 'setup'; toast('已開新波次'); commit();
  };
  var cw = $('#cloneWave');
  if (cw) cw.onclick = function () {
    var st = todayISO();
    var x = newCampaign(c.name + '（複製）', st, addDays(st, 14), c.budget);
    x.thresholds = JSON.parse(JSON.stringify(c.thresholds));
    x.minSample = JSON.parse(JSON.stringify(c.minSample));
    x.capacityWeek = c.capacityWeek;
    x.capacityTotal = c.capacityTotal;
    x.learningDays = c.learningDays;
    x.decisionDays = c.decisionDays;
    S.campaigns.push(x); S.activeId = x.id;
    TAB = 'setup'; toast('已用目前這波為範本開新波次'); commit();
  };
  var dw = $('#delWave');
  if (dw) dw.onclick = function () {
    if (S.campaigns.length < 2) { toast('至少要留一波'); return; }
    if (!confirm('確定刪除「' + c.name + '」？這筆資料會消失，無法復原。')) return;
    S.campaigns = S.campaigns.filter(function (x) { return x.id !== c.id; });
    S.activeId = S.campaigns[0].id;
    commit();
  };

  var pwGo = $('#pwGo');
  if (pwGo) pwGo.onclick = function () {
    var o = s('pw_old'), nw = s('pw_new');
    if (!o || nw.length < 8) { toast('新密碼至少 8 個字'); return; }
    pwGo.disabled = true; pwGo.textContent = '處理中…';
    rpc('ads_change_password', { tok: TOKEN, old_pw: o, new_pw: nw })
      .then(function () { toast('密碼已更改'); render(); })
      .catch(function (e) {
        pwGo.disabled = false; pwGo.textContent = '更改密碼';
        toast(e.message === 'bad_password' ? '目前密碼不對' : '改不了，請稍後再試');
      });
  };
  var so = $('#signOutBtn');
  if (so) so.onclick = function () {
    if (!confirm('登出後這台裝置要重新輸入密碼，確定嗎？')) return;
    rpc('ads_logout', { tok: TOKEN }).catch(function () {});
    signOut(false);
  };

  var ej = $('#expJson');
  if (ej) ej.onclick = function () {
    download('廣告作戰台備份_' + todayISO() + '.json', JSON.stringify(S, null, 2), 'application/json');
    toast('備份已下載');
  };
  var ec = $('#expCsv');
  if (ec) ec.onclick = function () {
    var rows = [['波次', '日期', '花費', '訊息數', '單則成本', 'CPM', 'CTR', '頻率']];
    S.campaigns.forEach(function (x) {
      x.days.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (d) {
        rows.push([x.name, d.date, d.spend, d.msgs, d.msgs ? (d.spend / d.msgs).toFixed(1) : '', d.cpm || '', d.ctr || '', d.freq || '']);
      });
    });
    var csv = '\uFEFF' + rows.map(function (r) {
      return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    download('廣告每日數字_' + todayISO() + '.csv', csv, 'text/csv');
    toast('CSV 已下載');
  };
  var em = $('#expMd');
  if (em) em.onclick = function () {
    download('波次總結_' + todayISO() + '.md', buildSummaryMd(c), 'text/markdown');
    toast('波次總結已下載');
  };
  var ij = $('#impJson');
  if (ij) ij.onclick = function () { $('#fileIn').click(); };
  var fi = $('#fileIn');
  if (fi) fi.onchange = function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d.campaigns || !d.campaigns.length) throw new Error('格式不對');
        if (!confirm('匯入會蓋掉目前所有資料，確定嗎？')) return;
        S = d; toast('已匯入，正在上傳到雲端'); commit();
      } catch (err) { toast('檔案讀不到，可能不是備份檔'); }
    };
    r.readAsText(f);
  };
}

/* ---------- 波次總結（純數字，不含判讀） ---------- */
function buildSummaryMd(c) {
  var m = computeMetrics(c, '9999-12-31');
  var D = '—';
  var L = [];
  function P(s) { L.push(s == null ? '' : s); }

  P('# 波次總結：' + c.name);
  P('');
  P('- 檔期：' + c.start + ' ～ ' + c.end);
  P('- 總預算：' + money(c.budget));
  P('- 實際花費：' + money(m.spend));
  P('- 剩餘預算：' + money(c.budget - m.spend));
  P('');

  P('## 漏斗轉換');
  P('');
  P('| 階段 | 數字 | 轉換率 |');
  P('| --- | --- | --- |');
  P('| 訊息 | ' + m.msgs + ' 則 | ' + D + ' |');
  P('| 預約 | ' + m.booked + ' 組 | ' + (m.bookRate === null ? D : pct(m.bookRate)) + '（訊息→預約） |');
  P('| 到場 | ' + m.showed + ' 組 | ' + (m.showRate === null ? D : pct(m.showRate)) + '（預約→到場） |');
  P('| 試上 | ' + m.trialYes + ' 組 | ' + (m.trialRate === null ? D : pct(m.trialRate)) + '（到場→試上） |');
  P('| 正式 | ' + m.enrolled + ' 位 | ' + (m.finalRate === null ? D : pct(m.finalRate)) + '（試上→正式） |');
  P('');

  P('## 單位成本');
  P('');
  P('| 項目 | 成本 |');
  P('| --- | --- |');
  P('| 每則訊息 | ' + (m.msgCost === null ? D : money(m.msgCost)) + ' |');
  P('| 每組預約 | ' + (m.costPerBooking === null ? D : money(m.costPerBooking)) + ' |');
  P('| 每組到場 | ' + (m.costPerShow === null ? D : money(m.costPerShow)) + ' |');
  P('| 每位學員 | ' + (m.cpa === null ? D : money(m.cpa)) + ' |');
  P('');

  var cpms = [], ctrs = [], freqs = [];
  for (var i = 0; i < c.days.length; i++) {
    var d = c.days[i];
    if (d.cpm) cpms.push(Number(d.cpm));
    if (d.ctr) ctrs.push(Number(d.ctr));
    if (d.freq) freqs.push(Number(d.freq));
  }
  function rng(arr, fmt) {
    if (!arr.length) return D;
    var mn = Math.min.apply(null, arr), mx = Math.max.apply(null, arr);
    var sum = 0;
    for (var k = 0; k < arr.length; k++) sum += arr[k];
    return fmt(mn) + '–' + fmt(mx) + '（平均 ' + fmt(sum / arr.length) + '）';
  }
  var fMoney = function (x) { return money(x); };
  var fPct = function (x) { return num(x, 2) + '%'; };
  var fNum = function (x) { return num(x, 2); };
  P('## 廣告品質');
  P('');
  P('| 指標 | 區間（平均） |');
  P('| --- | --- |');
  P('| CPM | ' + rng(cpms, fMoney) + ' |');
  P('| CTR | ' + rng(ctrs, fPct) + ' |');
  P('| 頻率 | ' + rng(freqs, fNum) + ' |');
  P('');

  var leaked = m.msgs - m.booked;
  var lostRows = [['只按按鈕', m.lost.button], ['真人未回覆', m.lost.noreply], ['時段不合', m.lost.timing], ['年齡不符', m.lost.age], ['嫌貴／問價後消失', m.lost.price]];
  if (m.lostUnknown > 0) lostRows.push(['未登記', m.lostUnknown]);
  P('## 流失原因');
  P('');
  P('| 原因 | 人數 | 佔流失 |');
  P('| --- | --- | --- |');
  lostRows.forEach(function (r) {
    P('| ' + r[0] + ' | ' + r[1] + ' | ' + (leaked > 0 ? Math.round(100 * r[1] / leaked) + '%' : D) + ' |');
  });
  P('');

  var wk = { spend: 0, msgs: 0 }, wd = { spend: 0, msgs: 0 };
  for (var j = 0; j < c.days.length; j++) {
    var dd = c.days[j];
    var dow = new Date(dd.date + 'T00:00:00').getDay();
    var bucket = (dow === 0 || dow === 6) ? wk : wd;
    bucket.spend += Number(dd.spend) || 0;
    bucket.msgs += Number(dd.msgs) || 0;
  }
  function mcost(b) { return b.msgs >= 1 ? money(b.spend / b.msgs) : D; }
  P('## 平日 vs 週末（每則訊息成本）');
  P('');
  P('| 類別 | 花費 | 訊息 | 每則成本 |');
  P('| --- | --- | --- | --- |');
  P('| 平日 | ' + money(wd.spend) + ' | ' + wd.msgs + ' | ' + mcost(wd) + ' |');
  P('| 週末 | ' + money(wk.spend) + ' | ' + wk.msgs + ' | ' + mcost(wk) + ' |');
  P('');

  var a57 = 0, a812 = 0, aOther = 0;
  for (var p = 0; p < c.bookings.length; p++) {
    var ag = Number(c.bookings[p].age);
    if (c.bookings[p].age == null || isNaN(ag)) aOther++;
    else if (ag >= 5 && ag <= 7) a57++;
    else if (ag >= 8 && ag <= 12) a812++;
    else aOther++;
  }
  P('## 年齡分布');
  P('');
  P('| 年齡層 | 組數 |');
  P('| --- | --- |');
  P('| 5–7 歲 | ' + a57 + ' |');
  P('| 8–12 歲 | ' + a812 + ' |');
  P('| 其他／未填 | ' + aOther + ' |');
  P('');

  P('## 每日數字');
  P('');
  P('| 日期 | 星期 | 花費 | 訊息 | 單則成本 | CPM | CTR | 頻率 |');
  P('| --- | --- | --- | --- | --- | --- | --- | --- |');
  var sorted = c.days.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  sorted.forEach(function (d) {
    var cost = d.msgs ? money(d.spend / d.msgs) : D;
    P('| ' + d.date + ' | ' + weekdayTW(d.date) + ' | ' + money(d.spend) + ' | ' + d.msgs + ' | ' + cost +
      ' | ' + (d.cpm ? money(d.cpm) : D) + ' | ' + (d.ctr ? num(d.ctr, 2) + '%' : D) + ' | ' + (d.freq ? num(d.freq, 2) : D) + ' |');
  });
  P('');

  return L.join('\n');
}

function download(name, text, mime) {
  var blob = new Blob([text], { type: mime });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
}

boot();

</script>
