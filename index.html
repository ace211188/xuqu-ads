        var deciding = col[0] === 'showed' && b.testDate && dayDiff(b.testDate, m.today) >= 3;
        var meta = (b.age ? b.age + ' 歲 · ' : '') + (late ? '測驗日已過，確認有沒有來' : deciding ? '到場 ' + dayDiff(b.testDate, m.today) + ' 天，還沒約試上' : '測驗 ' + shortDate(b.testDate));
        return '<div class="ov-card' + (late || deciding ? ' late' : '') + '" draggable="true" data-bid="' + b.id + '">' + esc(b.name || '（未填姓名）') + '<small>' + esc(meta) + '</small></div>';
      }).join('') + '</div>';
  }).join('') + '</div>';
  h += '<p class="tiny muted" style="margin:10px 0 0">拖到「沒成」：還沒到場的記成爽約、到場過的記成沒報名。細節（沒報名原因、直接報名）一樣在「記錄」頁改。</p>';
  h += '</div>';

  /* ── 每日圖表（所有波次）── */
  h += '<div class="panel">';
  h += '<div class="ov-head"><span class="ov-eng"><b>07</b>DAILY · 每日訊息（白條）與花費（橘線）</span><span class="ov-eng">ALL WAVES</span></div>';
  h += '<svg class="ov-chart" id="ovChart" viewBox="0 0 900 200" preserveAspectRatio="none"></svg>';
  h += '</div>';

  return h;
}

function wireOverview(c, m) {
  var A = allMetrics();
  var anim = !OV.animated && !OV_REDUCED;
  OV.animated = true;

  /* 今日結論：偶爾閃一下（只在黃燈、紅燈） */
  clearInterval(OV.glitchTimer);
  var vEl = document.getElementById('ovVerdict');
  var light = AGENT ? AGENT.light : m.verdict.level;
  if (vEl && !OV_REDUCED && (light === 'red' || light === 'amber')) {
    OV.glitchTimer = setInterval(function () {
      var el = document.getElementById('ovVerdict'); if (!el) return;
      el.classList.remove('glitch'); void el.offsetWidth; el.classList.add('glitch');
    }, 7000);
  }

  /* 這一波最近 14 天的訊息走勢 */
  var sp = document.getElementById('ovSpark');
  if (sp) {
    var days = c.days.filter(function (d) { return d.date <= m.today && (d.msgs != null || d.spend != null); })
      .sort(function (x, y) { return x.date < y.date ? -1 : 1; }).slice(-14);
    if (days.length >= 2) {
      var W = 700, maxM = Math.max(3, Math.max.apply(null, days.map(function (d) { return Number(d.msgs) || 0; })));
      var maxS = Math.max.apply(null, days.map(function (d) { return Number(d.spend) || 0; })) || 1;
      var X = function (i) { return 10 + i * (W - 20) / (days.length - 1); };
      var Y = function (v) { return 72 - (v / maxM) * 56; };
      var g = '<g stroke="#16313a"><line x1="0" y1="16" x2="700" y2="16"/><line x1="0" y1="44" x2="700" y2="44"/><line x1="0" y1="72" x2="700" y2="72"/></g>';
      days.forEach(function (d, i) { var hh = ((Number(d.spend) || 0) / maxS) * 34; g += '<rect x="' + (X(i) - 10) + '" y="' + (78 - hh) + '" width="20" height="' + hh + '" fill="rgba(255,90,31,.12)"/>'; });
      var pts = days.map(function (d, i) { return X(i) + ',' + Y(Number(d.msgs) || 0); }).join(' ');
      g += '<polyline id="ovLine" points="' + pts + '" fill="none" stroke="#3EC6E0" stroke-width="2" style="filter:drop-shadow(0 0 4px #3EC6E0)"/>';
      g += '<line id="ovCross" x1="0" y1="0" x2="0" y2="84" stroke="#3EC6E0" stroke-dasharray="2 3" opacity="0"/>';
      g += '<text x="4" y="11" fill="#3EC6E0" font-size="9.5" font-family="Consolas" letter-spacing="1.5">MSG / DAY · 最近 ' + days.length + ' 天</text>';
      sp.innerHTML = g;
      var ln = document.getElementById('ovLine');
      if (anim && ln.getTotalLength) {
        var L = Math.ceil(ln.getTotalLength()) + 1;
        ln.style.strokeDasharray = L; ln.style.strokeDashoffset = L;
        ln.getBoundingClientRect();
        ln.style.transition = 'stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1) .15s'; ln.style.strokeDashoffset = 0;
        setTimeout(function () { ln.style.strokeDasharray = 'none'; }, 1800);
      }
      sp.onmousemove = function (e) {
        var r = sp.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
        var i = Math.max(0, Math.min(days.length - 1, Math.round((px - 10) / (W - 20) * (days.length - 1))));
        var cr = document.getElementById('ovCross'); cr.setAttribute('x1', X(i)); cr.setAttribute('x2', X(i)); cr.setAttribute('opacity', 1);
        var d = days[i];
        ovTip(e, shortDate(d.date) + '（' + weekdayTW(d.date) + '）<br>訊息 <b>' + (d.msgs == null ? '—' : d.msgs) + '</b>　花費 <span class="o">' + (d.spend == null ? '—' : d.spend) + '</span>');
      };
      sp.onmouseleave = function () { document.getElementById('ovCross').setAttribute('opacity', 0); ovTipOff(); };
    } else {
      sp.outerHTML = '<p class="tiny muted" style="margin:8px 0 0">這一波記錄滿兩天後，這裡會出現每日訊息走勢。</p>';
    }
  }

  /* 雷達：掃描線掃過時亮起 */
  var rd = document.getElementById('ovRadar');
  if (rd && AGENT && AGENT.metrics && AGENT.metrics.new_reach != null) {
    var nr = AGENT.metrics.new_reach, total = 14, nNew = Math.round(nr / 100 * total);
    var pos = [[62,28],[30,66],[74,68],[40,22],[53,43],[22,40],[61,57],[44,76],[80,42],[34,50],[57,82],[18,60],[70,30],[46,60]];
    var blips = pos.slice(0, total).map(function (p, i) {
      var el = document.createElement('i'); el.className = 'ov-blip' + (i < nNew ? ' new' : '');
      el.style.left = p[0] + '%'; el.style.top = p[1] + '%'; rd.appendChild(el);
      return { el: el, ang: (Math.atan2(p[1] - 50, p[0] - 50) * 180 / Math.PI + 450) % 360 };
    });
    rd.onmousemove = function (e) { ovTip(e, '雲端 agent 最新報告<br>新面孔比例 <b>' + nr + '%</b><br>門檻 50%：低於代表受眾用完'); };
    rd.onmouseleave = ovTipOff;
    var run = ++OV.radarRun, t0 = performance.now();
    if (OV_REDUCED) blips.forEach(function (b) { b.el.classList.add('hit'); });
    else (function loop(t) {
      if (run !== OV.radarRun || !document.body.contains(rd)) return;
      var sw = ((t - t0) / 4000 * 360) % 360;
      blips.forEach(function (b) { b.el.classList.toggle('hit', (sw - b.ang + 360) % 360 < 60); });
      requestAnimationFrame(loop);
    })(t0);
  }

  /* 主角數字往上跳 */
  var hero = document.getElementById('ovHero');
  if (hero && hero.dataset.to !== undefined && hero.textContent !== '—') {
    var to = Number(hero.dataset.to);
    if (!anim) hero.textContent = to;
    else {
      var h0 = performance.now();
      (function step(t) { var p = Math.min((t - h0) / 1000, 1); hero.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); })(h0);
      setTimeout(function () { hero.textContent = to; }, 1400);
    }
  }

  /* LED 漏斗：一格一格亮 */
  document.querySelectorAll('.ov-meter').forEach(function (row, ri) {
    var on = Number(row.dataset.on), cells = row.querySelectorAll('.ov-seg i'), hot = row.classList.contains('leak');
    for (var k = 0; k < on && k < cells.length; k++) {
      (function (cell, delay) {
        if (anim) setTimeout(function () { cell.classList.add(hot ? 'hot' : 'on'); }, delay);
        else cell.classList.add(hot ? 'hot' : 'on');
      })(cells[k], 200 + ri * 110 + k * 26);
    }
  });

  /* 滑過顯示說明 */
  document.querySelectorAll('[data-ovtip]').forEach(function (el) {
    el.onmousemove = function (e) { ovTip(e, el.dataset.ovtip); };
    el.onmouseleave = ovTipOff;
  });

  /* 「去處理」 */
  document.querySelectorAll('[data-ovgo]').forEach(function (b) {
    b.onclick = function () {
      var g = b.dataset.ovgo;
      if (g === 'today') { TAB = 'today'; render(); window.scrollTo(0, 0); return; }
      var el = document.getElementById(g === 'rc' ? 'ovRc' : 'ovBoard');
      if (el) el.scrollIntoView({ behavior: OV_REDUCED ? 'auto' : 'smooth', block: 'start' });
    };
  });

  /* 試算器 */
  var dial = document.getElementById('ovDial');
  if (dial) {
    var MIN = 10, MAX = 80, A0 = -135, A1 = 135, ticks = '';
    for (var k = 0; k <= 30; k++) {
      var an = (A0 + k / 30 * (A1 - A0)) * Math.PI / 180, r1 = 63, r2 = k % 5 ? 58 : 54;
      ticks += '<line x1="' + (70 + Math.sin(an) * r2) + '" y1="' + (70 - Math.cos(an) * r2) + '" x2="' + (70 + Math.sin(an) * r1) + '" y2="' + (70 - Math.cos(an) * r1) + '" stroke-width="' + (k % 5 ? 1.2 : 2) + '" stroke-linecap="round"/>';
    }
    document.getElementById('ovTicks').innerHTML = ticks;
    var tickEls = Array.prototype.slice.call(document.querySelectorAll('#ovTicks line'));
    var rMB = A.rMsgBook || 0.25, rBS = A.rBookShow || 0.8, rTE = A.rTrialEnroll || 0.5;
    var cpmFor = function () {
      if (OV.cpmKey === 'red') return c.thresholds.msgCostRed;
      if (OV.cpmKey === 'now' && m.msgCost) return m.msgCost;
      return A.msgCost || c.thresholds.msgCostRed;
    };
    var calc = function (conv) {
      var tests = OV.target / rTE / (conv / 100), msgs = tests / rBS / rMB;
      return { tests: tests, msgs: msgs, cost: msgs * cpmFor() };
    };
    var base = Math.round((A.rShowTrial || 0.32) * 100);
    var paint = function () {
      var v = OV.conv, ang = A0 + (v - MIN) / (MAX - MIN) * (A1 - A0);
      document.getElementById('ovPtr').style.transform = 'rotate(' + ang + 'deg)';
      document.getElementById('ovVal').textContent = v;
      document.getElementById('ovConv').textContent = v + '%';
      dial.setAttribute('aria-valuenow', v);
      var lit = Math.round((v - MIN) / (MAX - MIN) * 30);
      tickEls.forEach(function (l, i) { l.setAttribute('stroke', i <= lit ? '#3EC6E0' : '#33403f'); });
      var now = calc(v), b0 = calc(base);
      document.getElementById('ovMsg').textContent = Math.round(now.msgs);
      document.getElementById('ovTest').textContent = Math.round(now.tests);
      document.getElementById('ovCost').textContent = Math.round(now.cost).toLocaleString('en-US');
      var diff = b0.cost - now.cost;
      document.getElementById('ovSave').innerHTML = v === base ? '這是你現在的轉換率。把旋鈕往右轉，看看測驗後接得更好能省多少。'
        : diff > 0 ? '比現在（' + base + '%）每月省 <b class="num" style="color:var(--cyan)">' + Math.round(diff).toLocaleString('en-US') + '</b> 元，廣告費 <b class="num" style="color:var(--cyan)">−' + Math.round(diff / b0.cost * 100) + '%</b>'
        : '比現在（' + base + '%）每月多花 <b class="num" style="color:var(--coral)">' + Math.round(-diff).toLocaleString('en-US') + '</b> 元';
    };
    var setFrom = function (e) {
      var r = dial.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var a2 = Math.atan2(e.clientX - cx, cy - e.clientY) * 180 / Math.PI;
      a2 = Math.max(A0, Math.min(A1, a2));
      OV.conv = Math.round(MIN + (a2 - A0) / (A1 - A0) * (MAX - MIN)); paint();
    };
    dial.onpointerdown = function (e) { dial.setPointerCapture(e.pointerId); setFrom(e); };
    dial.onpointermove = function (e) { if (dial.hasPointerCapture(e.pointerId)) setFrom(e); };
    dial.addEventListener('wheel', function (e) { e.preventDefault(); OV.conv = Math.max(MIN, Math.min(MAX, OV.conv + (e.deltaY < 0 ? 1 : -1))); paint(); }, { passive: false });
    dial.onkeydown = function (e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') OV.conv = Math.min(MAX, OV.conv + 1);
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') OV.conv = Math.max(MIN, OV.conv - 1);
      else return;
      e.preventDefault(); paint();
    };
    document.getElementById('ovMinus').onclick = function () { OV.target = Math.max(1, OV.target - 1); document.getElementById('ovTarget').textContent = OV.target; paint(); };
    document.getElementById('ovPlus').onclick = function () { OV.target = Math.min(30, OV.target + 1); document.getElementById('ovTarget').textContent = OV.target; paint(); };
    document.querySelectorAll('#ovCpm button').forEach(function (b) {
      b.onclick = function () { OV.cpmKey = b.dataset.k; document.querySelectorAll('#ovCpm button').forEach(function (x) { x.classList.toggle('on', x === b); }); paint(); };
    });
    paint();
  }

  /* 回訪清單 */
  var findB = function (id) {
    for (var i = 0; i < S.campaigns.length; i++) for (var j = 0; j < S.campaigns[i].bookings.length; j++) if (S.campaigns[i].bookings[j].id === id) return S.campaigns[i].bookings[j];
    return null;
  };
  document.querySelectorAll('[data-rccopy]').forEach(function (btn) {
    btn.onclick = function () { var b = findB(btn.dataset.rccopy); if (b) copyText(fillTpl(b), '訊息已複製'); };
  });
  document.querySelectorAll('[data-rcset]').forEach(function (btn) {
    btn.onclick = function () {
      var p = btn.dataset.rcset.split(':'), b = findB(p[0]); if (!b) return;
      b.recontact = { status: p[1], date: todayISO() };
      commit();
    };
  });
  document.querySelectorAll('#rcBand button').forEach(function (b) { b.onclick = function () { OV.rcFilter = b.dataset.k; render(); }; });
  var sd = document.getElementById('rcShowDone'); if (sd) sd.onchange = function () { OV.rcShowDone = sd.checked; render(); };
  var ts = document.getElementById('rcTplSave'); if (ts) ts.onclick = function () { S.recontactTpl = document.getElementById('rcTpl').value.trim() || RC_DEFAULT_TPL; toast('範本已儲存'); commit(); };
  var tr = document.getElementById('rcTplReset'); if (tr) tr.onclick = function () { delete S.recontactTpl; toast('已恢復預設範本'); commit(); };

  /* 預約看板：拖曳 */
  var dragId = null;
  document.querySelectorAll('.ov-card').forEach(function (cd) {
    cd.ondragstart = function (e) { dragId = cd.dataset.bid; cd.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} };
    cd.ondragend = function () { cd.classList.remove('dragging'); };
  });
  document.querySelectorAll('.ov-col').forEach(function (col) {
    col.ondragover = function (e) { e.preventDefault(); col.classList.add('over'); };
    col.ondragleave = function () { col.classList.remove('over'); };
    col.ondrop = function (e) {
      e.preventDefault(); col.classList.remove('over');
      var b = dragId && findB(dragId); if (!b) return;
      if (boardCol(b) === col.dataset.col) return;
      moveToCol(b, col.dataset.col);
      toast((b.name || '這一組') + ' → ' + col.querySelector('h3 span').textContent);
      commit();
    };
  });

  /* 每日圖表 */
  var ch = document.getElementById('ovChart');
  if (ch) {
    var W2 = 900, H2 = 200, pb = 26, pt = 12, gap = 12;
    var all = [];
    S.campaigns.slice().sort(function (x, y) { return x.start < y.start ? -1 : 1; }).forEach(function (cc, wi) {
      cc.days.filter(function (d) { return d.msgs != null || d.spend != null; }).sort(function (x, y) { return x.date < y.date ? -1 : 1; })
        .forEach(function (d) { all.push({ wi: wi, wave: cc.name, date: d.date, s: Number(d.spend) || 0, m: Number(d.msgs) || 0 }); });
    });
    if (all.length) {
      var nW = all[all.length - 1].wi + 1, bw = (W2 - gap * (nW - 1)) / all.length;
      var maxMs = Math.max(4, Math.max.apply(null, all.map(function (d) { return d.m; })));
      var maxSp = Math.max.apply(null, all.map(function (d) { return d.s; })) || 1;
      var xs = [], last = 0, xo = 0, g2 = '';
      all.forEach(function (d, i) {
        if (d.wi !== last) { xo += gap; last = d.wi; }
        var x = xo + i * bw; xs.push(x);
        var hh = d.m / maxMs * (H2 - pb - pt);
        g2 += '<rect x="' + (x + 1) + '" y="' + (H2 - pb - hh) + '" width="' + Math.max(1, bw - 2) + '" height="' + Math.max(hh, 1) + '" fill="#CFE7EC" opacity=".75"/>';
      });
      for (var wv = 0; wv < nW; wv++) {
        var idx = []; all.forEach(function (d, i) { if (d.wi === wv) idx.push(i); });
        if (!idx.length) continue;
        g2 += '<polyline points="' + idx.map(function (i) { return (xs[i] + bw / 2) + ',' + (H2 - pb - all[i].s / maxSp * (H2 - pb - pt)); }).join(' ') + '" fill="none" stroke="#FF5A1F" stroke-width="1.5" opacity=".9"/>';
        g2 += '<text x="' + xs[idx[0]] + '" y="' + (H2 - 8) + '" fill="#5f6d71" font-size="10.5" font-family="Microsoft JhengHei">' + esc(all[idx[0]].wave.slice(0, 12)) + '</text>';
      }
      g2 += '<line id="ovV" x1="0" y1="' + pt + '" x2="0" y2="' + (H2 - pb) + '" stroke="#3EC6E0" stroke-dasharray="2 3" opacity="0"/>';
      ch.innerHTML = g2;
      ch.onmousemove = function (e) {
        var r = ch.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W2, best = 0;
        xs.forEach(function (x, i) { if (Math.abs(x + bw / 2 - px) < Math.abs(xs[best] + bw / 2 - px)) best = i; });
        var d = all[best], vl = document.getElementById('ovV');
        vl.setAttribute('x1', xs[best] + bw / 2); vl.setAttribute('x2', xs[best] + bw / 2); vl.setAttribute('opacity', 1);
        ovTip(e, esc(d.wave) + '<br>' + shortDate(d.date) + '（' + weekdayTW(d.date) + '）　訊息 <b>' + d.m + '</b>　花費 <span class="o">' + d.s + '</span>' + (d.m ? '<br>每則 ' + Math.round(d.s / d.m) + ' 元' : ''));
      };
      ch.onmouseleave = function () { document.getElementById('ovV').setAttribute('opacity', 0); ovTipOff(); };
    } else {
      ch.outerHTML = '<p class="tiny muted">還沒有每日數字。</p>';
    }
  }
}

/* ---------- 今天 ---------- */
function viewToday(c, m) {
  var lv = m.verdict.level;
  var labelMap = { green: '綠燈', amber: '黃燈', red: '紅燈', full: '額滿', learning: '學習期', thin: '樣本不足', idle: '休止' };

  var h = '';

  /* 判定 */
  h += '<div class="verdict ' + lv + '">';
  h += '<div class="vlabel">' + (labelMap[lv] || '') + '　第 ' + Math.max(0, m.dayIndex) + ' / ' + m.totalDays + ' 天</div>';
  h += '<div class="vtitle">' + esc(m.verdict.title) + '</div>';
  h += '<p class="vline">' + esc(m.verdict.line) + '</p>';
  if (m.verdict.why && m.verdict.why.length) {
    h += '<div class="why">' + m.verdict.why.map(function (w) { return '<p>' + esc(w) + '</p>'; }).join('') + '</div>';
  }
  h += '<div class="eyebrow" style="margin-bottom:7px">現在該做的事</div>';
  h += '<ul class="todo">' + m.verdict.todo.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
  if (m.verdict.also && m.verdict.also.length) {
    h += '<div class="also"><div class="eyebrow">同時還有</div>';
    m.verdict.also.forEach(function (a) {
      h += '<div class="at">' + esc(a.title) + '</div>';
      h += '<p class="tiny muted" style="margin:0 0 8px">' + esc(a.line) + '</p>';
      h += '<ul class="todo">' + a.todo.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    });
    h += '</div>';
  }
  h += '</div>';

  /* 座位表 */
  var seats = '';
  var showedN = m.showed, bookedN = m.booked;
  for (var i = 0; i < Math.max(c.capacityTotal, bookedN); i++) {
    var cls = 'seat';
    if (i < showedN) cls += ' showed';
    else if (i < bookedN) cls += ' booked';
    if (i >= c.capacityTotal) cls += ' over';
    seats += '<div class="' + cls + '"></div>';
  }
  h += '<div class="panel">';
  h += '<div class="eyebrow">測驗座位</div>';
  h += '<h2><span class="num">' + bookedN + '</span> / ' + c.capacityTotal + ' 組已預約，其中 <span class="num">' + showedN + '</span> 組已到場</h2>';
  h += '<div class="seats">' + seats + '</div>';
  h += '<div class="legend"><span><i class="s"></i>已到場</span><span><i class="b"></i>已預約，還沒到</span><span><i></i>空位</span></div>';
  h += '<p class="tiny muted" style="margin:12px 0 0">' + esc(m.formulas.needPerDay) + '</p>';

  /* 每週產能 */
  if (m.weeks && m.weeks.length) {
    h += '<div class="hr"></div><div class="eyebrow">每週產能　一週最多 ' + c.capacityWeek + ' 組</div>';
    h += '<div class="tscroll"><table><thead><tr><th>週次</th><th>測驗日區間</th>' +
      '<th style="text-align:right">已排</th><th style="text-align:right">上限</th><th>狀態</th></tr></thead><tbody>';
    m.weeks.forEach(function (w) {
      var stateTxt;
      if (w.over) stateTxt = '超收 ' + (w.count - w.cap) + ' 組';
      else if (w.count === w.cap) stateTxt = '剛好滿';
      else stateTxt = '還有 ' + (w.cap - w.count) + ' 個';
      h += '<tr' + (w.over ? ' style="color:var(--gold)"' : '') + '>';
      h += '<td>第 ' + w.idx + ' 週</td>';
      h += '<td class="num tiny">' + shortDate(w.s) + '–' + shortDate(w.e) + '</td>';
      h += '<td class="n">' + w.count + '</td>';
      h += '<td class="n">' + w.cap + '</td>';
      h += '<td' + (w.over ? ' style="font-weight:700"' : '') + '>' + stateTxt + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  /* 日期條 */
  var strip = '';
  for (var d = 0; d < m.totalDays; d++) {
    var iso = addDays(c.start, d);
    var cls2 = 'dcell';
    if (d < c.learningDays) cls2 += ' learn';
    if (m.loggedDates[iso]) cls2 += ' has';
    if (iso === m.today) cls2 += ' today';
    if (iso > m.today) cls2 += ' future';
    strip += '<div class="' + cls2 + '" title="' + iso + '"><span class="dn">' + shortDate(iso).split('/')[1] + '</span>' + weekdayTW(iso) + '</div>';
  }
  h += '<div class="hr"></div><div class="eyebrow">檔期　前 ' + c.learningDays + " 天為學習期</div>";
  h += '<div class="strip">' + strip + '</div>';
  h += '</div>';

  /* 指標卡 */
  var t = c.thresholds;
  function card(k, val, tone, formula, tail, locked) {
    return '<div class="mcard"><div class="mk">' + k + '</div>' +
      '<div class="mv ' + (locked ? 'n' : tone) + '">' + val + '</div>' +
      '<div class="mf">' + esc(formula) + '</div>' +
      (locked ? '<div class="lock">' + esc(locked) + '</div>' : (tail ? '<div class="mt">' + esc(tail) + '</div>' : '')) +
      '</div>';
  }
  var tone1 = m.msgCost === null ? 'n' : (m.msgCost > t.msgCostRed ? 'r' : (m.msgCost > t.msgCostGreen ? 'a' : 'g'));
  var tone2 = m.bookRate === null ? 'n' : (m.bookRate < t.bookRate ? 'r' : 'g');
  var tone3 = m.showRate === null ? 'n' : (m.showRate < t.showRate ? 'a' : 'g');

  h += '<div class="panel"><div class="eyebrow">指標　結論下面就是算式</div><div class="mgrid">';
  h += card('每則訊息成本', m.msgCost === null ? '—' : money(m.msgCost), tone1, m.formulas.msgCost,
    '目標 <' + money(t.msgCostGreen) + '　紅線 ' + money(t.msgCostRed),
    m.msgCostReady ? null : '樣本不足：要滿 ' + c.minSample.msg + ' 則訊息才判讀');
  h += card('訊息 → 預約', m.bookRate === null ? '—' : pct(m.bookRate), tone2, m.formulas.bookRate,
    '目標 > ' + pct(t.bookRate),
    m.bookRateReady ? null : '樣本不足：要滿 ' + c.minSample.msg + ' 則訊息才判讀');
  h += card('預約 → 到場', m.showRate === null ? '—' : pct(m.showRate), tone3, m.formulas.showRate,
    '目標 > ' + pct(t.showRate),
    m.showRateReady ? null : '樣本不足：要滿 ' + c.minSample.show + ' 筆已到期預約才判讀');
  var toneTrial = m.trialRate === null ? 'n' : (m.trialRate < 0.40 ? 'r' : 'g');
  h += card('測驗 → 試上', m.trialRate === null ? '—' : pct(m.trialRate), toneTrial, m.formulas.trialRate,
    '目標 > 40%　最大流失通常在這一階',
    m.trialRateReady ? null : '樣本不足：要滿 ' + c.minSample.show + ' 組已到場才判讀');
  h += card('試上 → 正式', m.finalRate === null ? '—' : pct(m.finalRate), 'g', m.formulas.finalRate,
    '正式課折抵 1,000 元訂金',
    m.finalRateReady ? null : '樣本不足：要滿 ' + c.minSample.enroll + ' 組試上才判讀');
  h += card('每組預約成本', m.costPerBooking === null ? '—' : money(m.costPerBooking), 'g', m.formulas.costPerBooking,
    '當天就結算得出來', m.booked >= 1 ? null : '還沒有預約');
  h += card('每組到場成本', m.costPerShow === null ? '—' : money(m.costPerShow), 'g', m.formulas.costPerShow,
    '決策落後時看這個', m.showed >= 1 ? null : '還沒有人到場');
  h += card('每位學員成本', m.cpa === null ? '—' : money(m.cpa), 'g', m.formulas.cpa,
    '報名 ' + m.enrolled + ' 位' + (m.directEnrolled ? '（測驗 ' + m.enrolledTest + '＋直接報名 ' + m.directEnrolled + '）' : ''),
    m.enrolled >= 1 ? null : '還沒有人報名');
  h += card('剩餘預算', money(m.budgetLeft), 'g', money(c.budget) + ' − ' + money(m.spend) + ' = ' + money(m.budgetLeft),
    m.formulas.suggestDaily + '（參考值，改日預算會重跑學習期，非必要別動）');
  h += '</div></div>';

  /* 廣告健檢 */
  h += '<div class="panel"><div class="eyebrow">選填的三個數字　填了才知道成本高是「哪一種高」</div><div class="mgrid">';
  h += card('CPM', m.cpm === null ? '未填' : money(m.cpm), m.cpm === null ? 'n' : (m.cpm > t.cpmCap ? 'a' : 'g'),
    m.cpm === null ? '到廣告管理員抄一下' : '上限參考 ' + money(t.cpmCap), m.cpm > t.cpmCap ? '偏高＝受眾太窄' : '');
  h += card('點擊率 CTR', m.ctr === null ? '未填' : num(m.ctr, 2) + '%', m.ctr === null ? 'n' : (m.ctr < t.ctrFloor ? 'a' : 'g'),
    m.ctr === null ? '到廣告管理員抄一下' : '下限參考 ' + t.ctrFloor + '%', m.ctr !== null && m.ctr < t.ctrFloor ? '偏低＝影片或前兩行沒抓住人' : '');
  h += card('頻率', m.freq === null ? '未填' : num(m.freq, 2), m.freq === null ? 'n' : (m.freq >= t.freqCap ? 'a' : 'g'),
    m.freq === null ? '到廣告管理員抄一下' : '上限參考 ' + t.freqCap, m.freq !== null && m.freq >= t.freqCap ? '偏高＝受眾被洗太多次，該放寬半徑' : '');
  h += '</div></div>';

  /* 決策中，待跟進 */
  if (m.queue.length) {
    h += '<div class="panel"><div class="eyebrow">決策中　' +
      (m.queueTodo ? '<span style="color:var(--coral)">' + m.queueTodo + ' 位還沒聯絡</span>' : '全部都聯絡過了') + '</div>';
    h += '<h2>' + m.queue.length + ' 位到場過但還沒決定</h2>';
    h += '<p class="lede">廣告費已經花掉了，這些是成本最低的潛在學員。課表定下來的那一週最適合聯絡。</p>';
    h += '<div class="tscroll"><table><thead><tr><th>姓名</th><th style="text-align:right">年齡</th>' +
      '<th>測驗日</th><th style="text-align:right">已過</th><th>跟進</th></tr></thead><tbody>';
    m.queue.forEach(function (q) {
      var late = q.days !== null && q.days >= 14 && q.follow === 'none';
      h += '<tr' + (late ? ' style="color:var(--gold)"' : '') + '>';
      h += '<td>' + esc(q.name) + '</td>';
      h += '<td class="n">' + (q.age || '—') + '</td>';
      h += '<td class="num">' + shortDate(q.testDate) + '</td>';
      h += '<td class="n">' + (q.days === null ? '—' : q.days + ' 天') + '</td>';
      h += '<td><select data-follow="' + q.id + '" style="width:auto;padding:4px 8px;font-size:13px">' +
        '<option value="none"' + (q.follow === 'none' ? ' selected' : '') + '>未聯絡</option>' +
        '<option value="contacted"' + (q.follow === 'contacted' ? ' selected' : '') + '>已聯絡</option>' +
        '<option value="replied"' + (q.follow === 'replied' ? ' selected' : '') + '>已回覆</option>' +
        '<option value="dropped"' + (q.follow === 'dropped' ? ' selected' : '') + '>放棄追蹤</option>' +
        '</select>' + (q.followDate ? '<span class="tiny muted"> ' + shortDate(q.followDate) + '</span>' : '') + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div></div>';
  }

  /* 流失原因 */
  var leaked = m.msgs - m.booked;
  if (leaked > 0) {
    h += '<div class="panel"><div class="eyebrow">流失原因　在「記錄」頁登記</div>';
    h += '<h2>' + leaked + ' 則訊息沒有變成預約</h2>';
    if (m.lostTotal === 0) {
      h += '<p class="lede">還沒有登記任何原因。不知道人是為什麼走的，就只能猜。每天花 30 秒在「記錄」頁填一下。</p>';
    } else {
      var rows = [['只按按鈕', m.lost.button], ['真人未回覆', m.lost.noreply], ['時段不合', m.lost.timing], ['年齡不符', m.lost.age], ['嫌貴／問價後消失', m.lost.price]];
      if (m.lostUnknown > 0) rows.push(['未登記', m.lostUnknown]);
      h += '<div class="tscroll"><table><thead><tr><th>原因</th><th style="text-align:right">人數</th><th style="text-align:right">佔流失</th></tr></thead><tbody>';
      rows.forEach(function (r) {
        h += '<tr><td>' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="n">' +
          (leaked ? Math.round(100 * r[1] / leaked) + '%' : '—') + '</td></tr>';
      });
      h += '</tbody></table></div>';
      var top = rows.slice(0, 5).sort(function (a, b) { return b[1] - a[1]; })[0];
      if (top && top[1] > 0 && top[1] / leaked >= 0.4) {
        var fix = {
          '只按按鈕': '家長按了年齡按鈕，卻沒有回時段關鍵字。把收單規則的關鍵字放寬（好、可以、平日、週末……），或把時段和姓名合成一步問。',
          '真人未回覆':'回覆速度是關鍵。平日每小時整點掃一次收件匣，並補上 3 小時與 20 小時的挽回訊息（超過 24 小時就發不出去了）。',
          '時段不合': '時段開得不夠，或開的時段跟家長的作息對不上。先看是哪個年齡層在抱怨，再決定加開哪一段。',
          '年齡不符': '廣告把不對的人帶進來了。文案第一行要寫清楚適用年齡，讓不符合的人不要點。',
          '嫌貴／問價後消失': '價格沒有在廣告文案裡講清楚，篩選成本落到你的人力上。把價格前置到文案第一行。'
        }[top[0]];
        h += '<div class="why" style="margin-top:14px"><p><strong>' + top[0] + '</strong> 佔了流失的 ' +
          Math.round(100 * top[1] / leaked) + '%。</p><p>' + esc(fix) + '</p></div>';
      }
    }
    h += '</div>';
  }

  /* 到場後沒報名的原因 */
  if (m.afterTotal > 0) {
    var afterKnown = m.afterTotal - m.after.unknown;
    h += '<div class="panel"><div class="eyebrow">到場後沒報名　在「記錄」頁的預約名單選原因</div>';
    h += '<h2>' + m.afterTotal + ' 組到場了，但沒有走到報名</h2>';
    if (afterKnown === 0) {
      h += '<p class="lede">還沒有登記原因。這些家長已經花時間來過，問清楚為什麼沒報名，比再多花廣告費更值得。</p>';
    } else {
      var arows = AFTER_REASONS.map(function (r) { return [r[1], m.after[r[0]]]; });
      if (m.after.unknown > 0) arows.push(['未登記', m.after.unknown]);
      h += '<div class="tscroll"><table><thead><tr><th>原因</th><th style="text-align:right">組數</th><th style="text-align:right">佔比</th></tr></thead><tbody>';
      arows.forEach(function (r) {
        if (!r[1]) return;
        h += '<tr><td>' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="n">' +
          Math.round(100 * r[1] / m.afterTotal) + '%</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div>';
  }

  /* 每日例行 */
  h += '<div class="panel"><div class="eyebrow">每天只做這三件事</div><ul class="todo">' +
    DAILY_ROUTINE.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
    '</ul><p class="tiny muted" style="margin:10px 0 0">其他什麼都不要動。</p></div>';

  return h;
}

function emptyLost() { return { button: 0, noreply: 0, timing: 0, age: 0, price: 0 }; }

/* 到場後沒報名的原因（記在每一筆預約上） */
var AFTER_REASONS = [
  ['price', '價格'],
  ['schedule', '時間排不進'],
  ['distance', '距離太遠'],
  ['interest', '孩子興趣不足'],
  ['thinking', '還在考慮／沒回覆'],
  ['other', '其他']
];
function emptyAfter() {
  var o = { unknown: 0 };
  AFTER_REASONS.forEach(function (r) { o[r[0]] = 0; });
  return o;
}
function lostLabel(l) {
  if (!l) return '—';
  var parts = [];
  if (l.button)  parts.push('只按 ' + l.button);
  if (l.noreply) parts.push('未回 ' + l.noreply);
  if (l.timing)  parts.push('時段 ' + l.timing);
  if (l.age)     parts.push('年齡 ' + l.age);
  if (l.price)   parts.push('價格 ' + l.price);
  return parts.length ? parts.join('、') : '—';
}

/* ---------- 記錄 ---------- */
function viewLog(c, m) {
  var h = '';

  /* 每日廣告 */
  h += '<div class="panel">';
  h += '<h2>每日廣告數字</h2>';
  h += '<p class="lede">前三個必填，後三個選填但強烈建議——沒有它們，成本高的時候看不出是哪一種高。</p>';
  h += '<div class="entry day">';
  h += '<div><label class="fld">日期（預設昨天）</label><input type="date" id="d_date" value="' + addDays(todayISO(), -1) + '"></div>';
  h += '<div><label class="fld">花費 NT$</label><input class="num-in" id="d_spend" inputmode="decimal" placeholder="520"></div>';
  h += '<div><label class="fld">訊息數</label><input class="num-in" id="d_msgs" inputmode="numeric" placeholder="6"></div>';
  h += '<div><label class="fld">CPM</label><input class="num-in" id="d_cpm" inputmode="decimal" placeholder="選填"></div>';
  h += '<div><label class="fld">CTR %</label><input class="num-in" id="d_ctr" inputmode="decimal" placeholder="選填"></div>';
  h += '<div><label class="fld">頻率</label><input class="num-in" id="d_freq" inputmode="decimal" placeholder="選填"></div>';
  h += '<div><button class="act" id="addDay">記錄</button></div>';
  h += '</div>';
  var ldate = LOST_DATE || addDays(todayISO(), -1);
  var curLost = emptyLost();
  for (var li = 0; li < c.days.length; li++) {
    if (c.days[li].date === ldate && c.days[li].lost) { curLost = c.days[li].lost; break; }
  }
  h += '<div class="eyebrow" style="margin-top:16px">這些訊息為什麼沒約成？（選填，但填了才知道要修哪裡）</div>';
  h += '<p class="tiny muted" style="margin:2px 0 10px">遇到一個就點一下「+1」，即時累加到所選日期，不用再按「加入」。點錯用「−」修正。「只按按鈕」＝點了廣告按鈕但完全沒進對話；「真人未回覆」＝我們已回訊、對方不讀不回。</p>';
  h += '<div class="entry" style="grid-template-columns:auto auto;align-items:center;gap:8px 10px;margin-bottom:6px">';
  h += '<label class="fld" style="margin:0">記錄日期</label><input type="date" id="l_date" value="' + ldate + '">';
  h += '</div>';
  var LOSTCATS = [['button', '只按按鈕'], ['noreply', '真人未回覆'], ['timing', '時段不合'], ['age', '年齡不符'], ['price', '嫌貴／問價後消失']];
  h += '<div style="max-width:380px">';
  LOSTCATS.forEach(function (lc) {
    var key = lc[0], nm = lc[1], val = Number(curLost[key]) || 0;
    h += '<div style="display:grid;grid-template-columns:1fr 44px 52px 60px;align-items:center;gap:8px;margin:7px 0">' +
      '<span class="fld" style="margin:0">' + nm + '</span>' +
      '<button class="ghost" data-lostdec="' + key + '" style="padding:7px 0;text-align:center" aria-label="' + nm + ' 減一">−</button>' +
      '<span class="num" id="lc_' + key + '" style="text-align:center;font-weight:700;font-size:16px">' + val + '</span>' +
      '<button class="act" data-lostinc="' + key + '" style="padding:8px 0;text-align:center" aria-label="' + nm + ' 加一">+1</button>' +
      '</div>';
  });
  h += '</div>';

  var days = c.days.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  if (days.length) {
    h += '<div class="hr"></div><div class="tscroll"><table><thead><tr>' +
      '<th>日期</th><th style="text-align:right">花費</th><th style="text-align:right">訊息</th>' +
      '<th style="text-align:right">單則成本</th><th style="text-align:right">CPM</th><th style="text-align:right">CTR</th><th style="text-align:right">頻率</th><th>流失</th><th></th>' +
      '</tr></thead><tbody>';
    days.forEach(function (d) {
      var cost = d.msgs ? (d.spend / d.msgs) : null;
      h += '<tr>' +
        '<td class="num">' + shortDate(d.date) + '（' + weekdayTW(d.date) + '）</td>' +
        '<td class="n">' + money(d.spend) + '</td>' +
        '<td class="n">' + (d.msgs == null ? '—' : d.msgs) + '</td>' +
        '<td class="n">' + (cost === null ? '—' : money(cost)) + '</td>' +
        '<td class="n">' + (d.cpm ? money(d.cpm) : '—') + '</td>' +
        '<td class="n">' + (d.ctr ? num(d.ctr, 2) + '%' : '—') + '</td>' +
        '<td class="n">' + (d.freq ? num(d.freq, 2) : '—') + '</td>' +
        '<td class="tiny muted">' + lostLabel(d.lost) + '</td>' +
        '<td style="text-align:right"><button class="rowbtn" data-delday="' + d.date + '" title="刪除">✕</button></td>' +
        '</tr>';
    });
    h += '</tbody></table></div>';
  } else {
    h += '<div class="hr"></div><p class="tiny muted">還沒有任何記錄。開跑後每天早上花 30 秒把昨天的數字打進來。</p>';
  }
  h += '</div>';

  /* 預約名單 */
  h += '<div class="panel">';
  h += '<h2>預約名單</h2>';
  h += '<p class="lede">這份名單同時是你的測驗時段表。到場率只算「測驗日已經過了」的那些，所以剛預約還沒到測驗日的人不會拉低數字。</p>';
  h += '<div class="entry book">';
  h += '<div><label class="fld">預約日</label><input type="date" id="b_booked" value="' + todayISO() + '"></div>';
  h += '<div><label class="fld">測驗日</label><input type="date" id="b_test" value="' + addDays(todayISO(), 3) + '"></div>';
  h += '<div><label class="fld">孩子姓名</label><input id="b_name" placeholder="王小明"></div>';
  h += '<div><label class="fld">年齡</label><input class="num-in" id="b_age" inputmode="numeric" placeholder="7"></div>';
  h += '<div><button class="act" id="addBook">新增</button></div>';
  h += '</div>';
  h += '<p class="tiny muted" style="margin:14px 0 6px">看到廣告私訊、沒做測驗就直接報名的，記在這裡（不算進測驗漏斗，只算進報名和每位學員成本）：</p>';
  h += '<div class="entry book">';
  h += '<div><label class="fld">報名日</label><input type="date" id="d_date" value="' + todayISO() + '"></div>';
  h += '<div><label class="fld">孩子姓名</label><input id="d_name" placeholder="王小明"></div>';
  h += '<div><label class="fld">年齡</label><input class="num-in" id="d_age" inputmode="numeric" placeholder="7"></div>';
  h += '<div><button class="act" id="addDirect">直接報名</button></div>';
  h += '</div>';

  var bs = c.bookings.slice().sort(function (a, b) {
    var ka = a.testDate || a.bookedDate || '', kb = b.testDate || b.bookedDate || '';
    return ka < kb ? 1 : -1;
  });
  var selStyle = ' style="width:auto;padding:4px 8px;font-size:13px"';
  if (bs.length) {
    h += '<div class="hr"></div><div class="tscroll"><table><thead><tr>' +
      '<th>測驗日</th><th>姓名</th><th style="text-align:right">年齡</th><th>到場</th><th>試上</th><th>報名</th><th>沒報名原因</th><th></th>' +
      '</tr></thead><tbody>';
    bs.forEach(function (b) {
      if (b.kind === 'direct') {
        h += '<tr>';
        h += '<td class="num">' + shortDate(b.bookedDate) + '（' + weekdayTW(b.bookedDate) + '）</td>';
        h += '<td>' + esc(b.name || '—') + '</td>';
        h += '<td class="n">' + (b.age || '—') + '</td>';
        h += '<td colspan="2" class="tiny muted">直接報名（沒做測驗）</td>';
        h += '<td><select data-enroll="' + b.id + '"' + selStyle + '>' +
          '<option value="yes"' + (b.enrolled === true ? ' selected' : '') + '>已報名</option>' +
          '<option value="no"' + (b.enrolled !== true ? ' selected' : '') + '>沒報名</option>' +
          '</select></td>';
        h += '<td></td>';
        h += '<td style="text-align:right"><button class="rowbtn" data-delbook="' + b.id + '" title="刪除">✕</button></td>';
        h += '</tr>';
        return;
      }
      var due = b.testDate && b.testDate <= m.today;
      var needReason = b.status === 'showed' && (b.enrolled === false || b.trial === 'declined');
      h += '<tr>';
      h += '<td class="num">' + shortDate(b.testDate) + '（' + weekdayTW(b.testDate) + '）' +
        (due ? '' : '<span class="tiny muted"> 未到期</span>') + '</td>';
      h += '<td>' + esc(b.name || '—') + '</td>';
      h += '<td class="n">' + (b.age || '—') + '</td>';
      h += '<td><select data-status="' + b.id + '" style="width:auto;padding:4px 8px;font-size:13px">' +
        '<option value="pending"' + (b.status === 'pending' ? ' selected' : '') + '>待確認</option>' +
        '<option value="showed"' + (b.status === 'showed' ? ' selected' : '') + '>已到場</option>' +
        '<option value="noshow"' + (b.status === 'noshow' ? ' selected' : '') + '>爽約</option>' +
        '</select></td>';
      h += '<td><select data-trial="' + b.id + '" style="width:auto;padding:4px 8px;font-size:13px"' +
        (b.status === 'showed' ? '' : ' disabled') + '>' +
        '<option value="none"' + (!b.trial || b.trial === 'none' ? ' selected' : '') + '>未定</option>' +
        '<option value="booked"' + (b.trial === 'booked' ? ' selected' : '') + '>已約試上</option>' +
        '<option value="done"' + (b.trial === 'done' ? ' selected' : '') + '>已試上</option>' +
        '<option value="declined"' + (b.trial === 'declined' ? ' selected' : '') + '>不試上</option>' +
        '</select></td>';
      h += '<td><select data-enroll="' + b.id + '" style="width:auto;padding:4px 8px;font-size:13px"' +
        (b.status === 'showed' ? '' : ' disabled') + '>' +
        '<option value=""' + (b.enrolled === null || b.enrolled === undefined ? ' selected' : '') + '>未定</option>' +
        '<option value="yes"' + (b.enrolled === true ? ' selected' : '') + '>已報名</option>' +
        '<option value="no"' + (b.enrolled === false ? ' selected' : '') + '>沒報名</option>' +
        '</select></td>';
      h += '<td><select data-reason="' + b.id + '"' + selStyle + (needReason ? '' : ' disabled') + '>' +
        '<option value=""' + (!b.lostReason ? ' selected' : '') + '>' + (needReason ? '未登記' : '—') + '</option>' +
        AFTER_REASONS.map(function (r) {
          return '<option value="' + r[0] + '"' + (b.lostReason === r[0] ? ' selected' : '') + '>' + r[1] + '</option>';
        }).join('') +
        '</select></td>';
      h += '<td style="text-align:right"><button class="rowbtn" data-delbook="' + b.id + '" title="刪除">✕</button></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    h += '<p class="tiny muted" style="margin:12px 0 0">已預約 ' + m.booked + ' 組｜測驗日已過 ' + m.dueTotal +
      ' 組｜到場 ' + m.showed + '｜爽約 ' + m.noshow + '｜還沒到測驗日 ' + m.pendingTest +
      '｜試上 ' + m.trialDone + '｜報名 ' + m.enrolled +
      (m.directEnrolled ? '（含直接報名 ' + m.directEnrolled + '）' : '') +
      '｜決策中 ' + m.deciding + '</p>';
  } else {
    h += '<div class="hr"></div><p class="tiny muted">還沒有預約。每接到一組就打一列，大約 15 秒。</p>';
  }
  h += '</div>';

  return h;
}

/* ---------- 素材 ---------- */
function viewAssets(c, m) {
  var h = '';
  h += '<div class="panel"><h2>主文案</h2>' +
    '<p class="lede">三組全部貼進同一則廣告的「主要文字」欄位（點「新增文字選項」）。這不會分散預算，Meta 會自動組合並把錢導向表現好的組合。</p>';

  S.campaigns.forEach(function (x) {
    var mm = computeMetrics(x);

    h += '<td class="n">' + mm.booked + '</td>';
    h += '<td class="n">' + mm.showed + '</td>';
    h += '<td class="n">' + mm.trialDone + '</td>';
    h += '<td class="n">' + mm.enrolled + (mm.directEnrolled ? '<span class="tiny muted">（直接 ' + mm.directEnrolled + '）</span>' : '') + '</td>';

  }
  h += '</div>';
  return h;
}

/* ============================================================
   事件
   ============================================================ */
function n(id) {
  var el = document.getElementById(id);
  if (!el) return null;
  var v = parseFloat(el.value);
  return isNaN(v) ? null : v;
}
function s(id) {
  var el = document.getElementById(id);
  return el ? el.value : '';
}

function wire() {
  var c = C();

  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.onclick = function () { TAB = b.dataset.tab; render(); window.scrollTo(0, 0); };
  });

  $('#waveSelect').onchange = function (e) { S.activeId = e.target.value; commit(); };

  document.querySelectorAll('[data-copy]').forEach(function (b) {
    b.onclick = function () {
      var k = b.dataset.copy, txt = '', label = '已複製';
      if (k.indexOf('copy_') === 0) {
        COPY_BLOCKS.forEach(function (x) { if ('copy_' + x.id === k) { txt = x.text; label = x.label; } });
      } else if (k.indexOf('msg_') === 0) {
        MSG_BLOCKS.forEach(function (x) { if ('msg_' + x.id === k) { txt = x.text; label = x.label; } });
      } else if (k.indexOf('btn_') === 0) {
        MSG_BLOCKS.forEach(function (x) { if ('btn_' + x.id === k) { txt = x.buttons.join('\n'); label = '按鈕文字'; } });
      } else if (k === 'headlines') { txt = HEADLINES.join('\n'); label = '標題'; }
      else if (k === 'desc') { txt = DESCRIPTION; label = '描述'; }
      else if (k === 'intake') { txt = NEXT_WAVE_INTAKE; label = '資料清單'; }
      copyText(txt, label);
    };
  });

  var addDayBtn = $('#addDay');
  if (addDayBtn) addDayBtn.onclick = function () {
    var date = s('d_date');
    if (!date) { toast('請選日期'); return; }
    var spend = n('d_spend'), msgs = n('d_msgs');
    if (spend === null || msgs === null) { toast('花費和訊息數要填'); return; }
    if (date >= todayISO()) {
      if (!confirm('這是今天的數字，Meta 還沒跑完整天，成本會偏高。確定要記錄嗎？')) return;
    }
    var idx = -1;
    for (var i = 0; i < c.days.length; i++) if (c.days[i].date === date) idx = i;
    var prevLost = (idx >= 0 && c.days[idx].lost) ? c.days[idx].lost : emptyLost();
    var rec = { date: date, spend: spend, msgs: msgs, cpm: n('d_cpm'), ctr: n('d_ctr'), freq: n('d_freq'), lost: prevLost };
    if (idx >= 0) { c.days[idx] = rec; toast(shortDate(date) + ' 已更新'); }
    else { c.days.push(rec); toast(shortDate(date) + ' 已記錄'); }
    commit();
  };

  var ldateEl = $('#l_date');
  if (ldateEl) ldateEl.onchange = function () { LOST_DATE = this.value; render(); };

  function lostDayIdx(date, createIfMissing) {
    var idx = -1;
    for (var i = 0; i < c.days.length; i++) if (c.days[i].date === date) idx = i;
    if (idx < 0 && createIfMissing) {
      c.days.push({ date: date, spend: null, msgs: null, cpm: null, ctr: null, freq: null, lost: emptyLost() });
      idx = c.days.length - 1;
    }
    return idx;
  }

  document.querySelectorAll('[data-lostinc]').forEach(function (b) {
    b.onclick = function () {
      var key = b.dataset.lostinc, date = s('l_date');
      if (!date) { toast('請選日期'); return; }
      var idx = lostDayIdx(date, true);
      var L = c.days[idx].lost || emptyLost();
      L[key] = (Number(L[key]) || 0) + 1;
      c.days[idx].lost = L;
      var span = document.getElementById('lc_' + key);
      if (span) span.textContent = L[key];
      saveState(); schedulePush();
    };
  });

  document.querySelectorAll('[data-lostdec]').forEach(function (b) {
    b.onclick = function () {
      var key = b.dataset.lostdec, date = s('l_date');
      if (!date) { toast('請選日期'); return; }
      var idx = lostDayIdx(date, false);
      if (idx < 0) return;
      var L = c.days[idx].lost || emptyLost();
      var cur = Number(L[key]) || 0;
      if (cur <= 0) return;
      L[key] = cur - 1;
      c.days[idx].lost = L;
      var span = document.getElementById('lc_' + key);
      if (span) span.textContent = L[key];
      saveState(); schedulePush();
    };
  });

  document.querySelectorAll('[data-delday]').forEach(function (b) {
    b.onclick = function () {
      var d = b.dataset.delday;
      c.days = c.days.filter(function (x) { return x.date !== d; });
      commit();
    };
  });

  var addBookBtn = $('#addBook');
  if (addBookBtn) addBookBtn.onclick = function () {
    var bd = s('b_booked'), td = s('b_test');
    if (!bd || !td) { toast('預約日和測驗日都要填'); return; }
    c.bookings.push({
      id: 'b' + Date.now() + Math.floor(Math.random() * 999),
      bookedDate: bd, testDate: td,
      name: s('b_name'), age: n('b_age'),
      status: 'pending', enrolled: null
    });
    toast('已加入名單');
    commit();
  };

  var addDirectBtn = $('#addDirect');
  if (addDirectBtn) addDirectBtn.onclick = function () {
    var dd = s('d_date');
    if (!dd) { toast('報名日要填'); return; }
    c.bookings.push({
      id: 'b' + Date.now() + Math.floor(Math.random() * 999),
      kind: 'direct', bookedDate: dd, testDate: null,
      name: s('d_name'), age: n('d_age'),
      status: 'direct', enrolled: true
    });
    toast('已記為直接報名');
    commit();
  };

  document.querySelectorAll('[data-reason]').forEach(function (sel) {
    sel.onchange = function () {
      var id = sel.dataset.reason;
      c.bookings.forEach(function (b) {
        if (b.id === id) b.lostReason = sel.value || null;
      });
      commit();
    };
  });

  document.querySelectorAll('[data-status]').forEach(function (sel) {
    sel.onchange = function () {
      var id = sel.dataset.status;
      c.bookings.forEach(function (b) {
        if (b.id === id) {
          b.status = sel.value;
          if (b.status !== 'showed') { b.enrolled = null; b.trial = 'none'; b.trialDate = null; b.lostReason = null; }
        }
      });
      commit();
    };
  });
  document.querySelectorAll('[data-trial]').forEach(function (sel) {
    sel.onchange = function () {
      var id = sel.dataset.trial;
      c.bookings.forEach(function (b) {
        if (b.id === id) {
          b.trial = sel.value;
          b.trialDate = (sel.value === 'booked' || sel.value === 'done') ? (b.trialDate || todayISO()) : null;
        }
      });
      commit();
    };
  });
  document.querySelectorAll('[data-enroll]').forEach(function (sel) {
    sel.onchange = function () {
      var id = sel.dataset.enroll;
      c.bookings.forEach(function (b) {
        if (b.id === id) b.enrolled = sel.value === 'yes' ? true : (sel.value === 'no' ? false : null);
      });
      commit();
    };
  });
  document.querySelectorAll('[data-delbook]').forEach(function (b) {
    b.onclick = function () {
      var id = b.dataset.delbook;
      c.bookings = c.bookings.filter(function (x) { return x.id !== id; });
      commit();
    };
  });

  document.querySelectorAll('[data-follow]').forEach(function (sel) {
    sel.onchange = function () {
      var id = sel.dataset.follow;
      c.bookings.forEach(function (b) {
        if (b.id === id) {
          b.follow = sel.value;
          b.followDate = (sel.value === 'none') ? null : todayISO();
        }
      });
      commit();
    };
  });

  document.querySelectorAll('[data-chk]').forEach(function (cb) {
    cb.onchange = function () { c.checklist[cb.dataset.chk] = cb.checked; commit(); };
  });

  var saveCfg = $('#saveCfg');
  if (saveCfg) saveCfg.onclick = function () {
    c.name = s('s_name') || c.name;
    c.start = s('s_start'); c.end = s('s_end');
    c.budget = n('s_budget') || c.budget;
    c.capacityTotal = n('s_cap') || c.capacityTotal;
    c.capacityWeek = n('s_capw') || c.capacityWeek;
    c.learningDays = n('s_learn') || c.learningDays;
    toast('已儲存'); commit();
  };
  var saveTh = $('#saveTh');
  if (saveTh) saveTh.onclick = function () {
    c.thresholds.msgCostGreen = n('t_g') || c.thresholds.msgCostGreen;
    c.thresholds.msgCostRed = n('t_r') || c.thresholds.msgCostRed;
    c.thresholds.bookRate = (n('t_b') || 40) / 100;
    c.thresholds.showRate = (n('t_s') || 70) / 100;
    c.thresholds.freqCap = n('t_f') || c.thresholds.freqCap;
    c.decisionDays = n('t_d') || c.decisionDays;
    toast('門檻已更新'); commit();
  };

  var nw = $('#newWave');
  if (nw) nw.onclick = function () {
    var st = todayISO();
    var x = newCampaign('新的一波', st, addDays(st, 18), 10000);
    S.campaigns.push(x); S.activeId = x.id;
    TAB = 'setup'; toast('已開新波次'); commit();
  };
  var cw = $('#cloneWave');
  if (cw) cw.onclick = function () {
    var st = todayISO();
    var x = newCampaign(c.name + '（複製）', st, addDays(st, 14), c.budget);
    x.thresholds = JSON.parse(JSON.stringify(c.thresholds));
    x.minSample = JSON.parse(JSON.stringify(c.minSample));
    x.capacityWeek = c.capacityWeek;
    x.capacityTotal = c.capacityTotal;
    x.learningDays = c.learningDays;
    x.decisionDays = c.decisionDays;
    S.campaigns.push(x); S.activeId = x.id;
    TAB = 'setup'; toast('已用目前這波為範本開新波次'); commit();
  };
  var dw = $('#delWave');
  if (dw) dw.onclick = function () {
    if (S.campaigns.length < 2) { toast('至少要留一波'); return; }
    if (!confirm('確定刪除「' + c.name + '」？這筆資料會消失，無法復原。')) return;
    S.campaigns = S.campaigns.filter(function (x) { return x.id !== c.id; });
    S.activeId = S.campaigns[0].id;
    commit();
  };

  var pwGo = $('#pwGo');
  if (pwGo) pwGo.onclick = function () {
    var o = s('pw_old'), nw = s('pw_new');
    if (!o || nw.length < 8) { toast('新密碼至少 8 個字'); return; }
    pwGo.disabled = true; pwGo.textContent = '處理中…';
    rpc('ads_change_password', { tok: TOKEN, old_pw: o, new_pw: nw })
      .then(function () { toast('密碼已更改'); render(); })
      .catch(function (e) {
        pwGo.disabled = false; pwGo.textContent = '更改密碼';
        toast(e.message === 'bad_password' ? '目前密碼不對' : '改不了，請稍後再試');
      });
  };
  var so = $('#signOutBtn');
  if (so) so.onclick = function () {
    if (!confirm('登出後這台裝置要重新輸入密碼，確定嗎？')) return;
    rpc('ads_logout', { tok: TOKEN }).catch(function () {});
    signOut(false);
  };

  var ej = $('#expJson');
  if (ej) ej.onclick = function () {
    download('廣告作戰台備份_' + todayISO() + '.json', JSON.stringify(S, null, 2), 'application/json');
    toast('備份已下載');
  };
  var ec = $('#expCsv');
  if (ec) ec.onclick = function () {
    var rows = [['波次', '日期', '花費', '訊息數', '單則成本', 'CPM', 'CTR', '頻率']];
    S.campaigns.forEach(function (x) {
      x.days.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (d) {
        rows.push([x.name, d.date, d.spend, d.msgs, d.msgs ? (d.spend / d.msgs).toFixed(1) : '', d.cpm || '', d.ctr || '', d.freq || '']);
      });
    });
    var csv = '\uFEFF' + rows.map(function (r) {
      return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    download('廣告每日數字_' + todayISO() + '.csv', csv, 'text/csv');
    toast('CSV 已下載');
  };
  var em = $('#expMd');
  if (em) em.onclick = function () {
    download('波次總結_' + todayISO() + '.md', buildSummaryMd(c), 'text/markdown');
    toast('波次總結已下載');
  };
  var ij = $('#impJson');
  if (ij) ij.onclick = function () { $('#fileIn').click(); };
  var fi = $('#fileIn');
  if (fi) fi.onchange = function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d.campaigns || !d.campaigns.length) throw new Error('格式不對');
        if (!confirm('匯入會蓋掉目前所有資料，確定嗎？')) return;
        S = d; toast('已匯入，正在上傳到雲端'); commit();
      } catch (err) { toast('檔案讀不到，可能不是備份檔'); }
    };
    r.readAsText(f);
  };
}

/* ---------- 波次總結（純數字，不含判讀） ---------- */
function buildSummaryMd(c) {
  var m = computeMetrics(c, '9999-12-31');
  var D = '—';
  var L = [];
  function P(s) { L.push(s == null ? '' : s); }

  P('# 波次總結：' + c.name);
  P('');
  P('- 檔期：' + c.start + ' ～ ' + c.end);
  P('- 總預算：' + money(c.budget));
  P('- 實際花費：' + money(m.spend));
  P('- 剩餘預算：' + money(c.budget - m.spend));
  P('');

  P('## 漏斗轉換');
  P('');
  P('| 階段 | 數字 | 轉換率 |');
  P('| --- | --- | --- |');
  P('| 訊息 | ' + m.msgs + ' 則 | ' + D + ' |');
  P('| 預約 | ' + m.booked + ' 組 | ' + (m.bookRate === null ? D : pct(m.bookRate)) + '（訊息→預約） |');
  P('| 到場 | ' + m.showed + ' 組 | ' + (m.showRate === null ? D : pct(m.showRate)) + '（預約→到場） |');
  P('| 試上 | ' + m.trialYes + ' 組 | ' + (m.trialRate === null ? D : pct(m.trialRate)) + '（到場→試上） |');
  P('| 正式 | ' + m.enrolled + ' 位 | ' + (m.finalRate === null ? D : pct(m.finalRate)) + '（試上→正式） |');
  P('');

  P('## 單位成本');
  P('');
  P('| 項目 | 成本 |');
  P('| --- | --- |');
  P('| 每則訊息 | ' + (m.msgCost === null ? D : money(m.msgCost)) + ' |');
  P('| 每組預約 | ' + (m.costPerBooking === null ? D : money(m.costPerBooking)) + ' |');
  P('| 每組到場 | ' + (m.costPerShow === null ? D : money(m.costPerShow)) + ' |');
  P('| 每位學員 | ' + (m.cpa === null ? D : money(m.cpa)) + ' |');
  P('');

  var cpms = [], ctrs = [], freqs = [];
  for (var i = 0; i < c.days.length; i++) {
    var d = c.days[i];
    if (d.cpm) cpms.push(Number(d.cpm));
    if (d.ctr) ctrs.push(Number(d.ctr));
    if (d.freq) freqs.push(Number(d.freq));
  }
  function rng(arr, fmt) {
    if (!arr.length) return D;
    var mn = Math.min.apply(null, arr), mx = Math.max.apply(null, arr);
    var sum = 0;
    for (var k = 0; k < arr.length; k++) sum += arr[k];
    return fmt(mn) + '–' + fmt(mx) + '（平均 ' + fmt(sum / arr.length) + '）';
  }
  var fMoney = function (x) { return money(x); };
  var fPct = function (x) { return num(x, 2) + '%'; };
  var fNum = function (x) { return num(x, 2); };
  P('## 廣告品質');
  P('');
  P('| 指標 | 區間（平均） |');
  P('| --- | --- |');
  P('| CPM | ' + rng(cpms, fMoney) + ' |');
  P('| CTR | ' + rng(ctrs, fPct) + ' |');
  P('| 頻率 | ' + rng(freqs, fNum) + ' |');
  P('');

  var leaked = m.msgs - m.booked;
  var lostRows = [['只按按鈕', m.lost.button], ['真人未回覆', m.lost.noreply], ['時段不合', m.lost.timing], ['年齡不符', m.lost.age], ['嫌貴／問價後消失', m.lost.price]];
  if (m.lostUnknown > 0) lostRows.push(['未登記', m.lostUnknown]);
  P('## 流失原因');
  P('');
  P('| 原因 | 人數 | 佔流失 |');
  P('| --- | --- | --- |');
  lostRows.forEach(function (r) {
    P('| ' + r[0] + ' | ' + r[1] + ' | ' + (leaked > 0 ? Math.round(100 * r[1] / leaked) + '%' : D) + ' |');
  });
  P('');

  var wk = { spend: 0, msgs: 0 }, wd = { spend: 0, msgs: 0 };
  for (var j = 0; j < c.days.length; j++) {
    var dd = c.days[j];
    var dow = new Date(dd.date + 'T00:00:00').getDay();
    var bucket = (dow === 0 || dow === 6) ? wk : wd;
    bucket.spend += Number(dd.spend) || 0;
    bucket.msgs += Number(dd.msgs) || 0;
  }
  function mcost(b) { return b.msgs >= 1 ? money(b.spend / b.msgs) : D; }
  P('## 平日 vs 週末（每則訊息成本）');
  P('');
  P('| 類別 | 花費 | 訊息 | 每則成本 |');
  P('| --- | --- | --- | --- |');
  P('| 平日 | ' + money(wd.spend) + ' | ' + wd.msgs + ' | ' + mcost(wd) + ' |');
  P('| 週末 | ' + money(wk.spend) + ' | ' + wk.msgs + ' | ' + mcost(wk) + ' |');
  P('');

  var a57 = 0, a812 = 0, aOther = 0;
  for (var p = 0; p < c.bookings.length; p++) {
    var ag = Number(c.bookings[p].age);
    if (c.bookings[p].age == null || isNaN(ag)) aOther++;
    else if (ag >= 5 && ag <= 7) a57++;
    else if (ag >= 8 && ag <= 12) a812++;
    else aOther++;
  }
  P('## 年齡分布');
  P('');
  P('| 年齡層 | 組數 |');
  P('| --- | --- |');
  P('| 5–7 歲 | ' + a57 + ' |');
  P('| 8–12 歲 | ' + a812 + ' |');
  P('| 其他／未填 | ' + aOther + ' |');
  P('');

  P('## 每日數字');
  P('');
  P('| 日期 | 星期 | 花費 | 訊息 | 單則成本 | CPM | CTR | 頻率 |');
  P('| --- | --- | --- | --- | --- | --- | --- | --- |');
  var sorted = c.days.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  sorted.forEach(function (d) {
    var cost = d.msgs ? money(d.spend / d.msgs) : D;
    P('| ' + d.date + ' | ' + weekdayTW(d.date) + ' | ' + money(d.spend) + ' | ' + d.msgs + ' | ' + cost +
      ' | ' + (d.cpm ? money(d.cpm) : D) + ' | ' + (d.ctr ? num(d.ctr, 2) + '%' : D) + ' | ' + (d.freq ? num(d.freq, 2) : D) + ' |');
  });
  P('');

  return L.join('\n');
}

function download(name, text, mime) {
  var blob = new Blob([text], { type: mime });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
}

boot();

</script>
